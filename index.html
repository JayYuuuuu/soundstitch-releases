/* ---------- 定时 ---------- */
async function loadScheds() {
  const who = encodeURIComponent(`player='${S.sel}'`);
  // 规则和它的执行历史一起取：分成两个入口，就会出现「规则刷新了、历史还是上一台
  // 机器的」这种半新半旧的画面。
  const [r, h] = await Promise.all([
    api('/api/collections/ss_schedules/records?perPage=200&sort=startTime&filter=' + who),
    // Mac 端每台只保留 200 行（写 start 时修剪），取满 200 就是全部日志
    api('/api/collections/ss_runs/records?perPage=200&sort=-created&filter=' + who)
      .catch(() => ({ items: [] })),   // 老服务端没有这张表，规则本身照常显示
  ]);
  S.scheds = r.items || []; S.runs = h.items || [];
  renderRules(); renderLog();
}

/* 这条规则的执行历史，新的在前 */
const runsOf = id => S.runs.filter(r => r.schedule === id);

/* 还开着的那次执行：最新一行是 start，说明还没收到收尾行 */
function openRun(id) {
  const rs = runsOf(id);
  return rs.length && rs[0].event === 'start' ? rs[0] : null;
}

/* 规则卡右上角的一行结论。
 *
 * 以前它只会说「下次 08:00」——包括这条规则**正在响**的那半小时。执行中恰恰是
 * 唯一想看一眼的时刻，而那时它显示的是一个和当下无关的未来时间。 */
function ruleBadge(s, f, p) {
  const open = openRun(s.id);
  const inWindow = liveTake(s);

  if (open && p && isLive(p) && p.state === 'playing') {
    const on = (Date.now() - pbDate(open.created).getTime()) / 1000;
    if (!reportsCount(p)) return ['正在播 · ' + fmt(on), 'ok'];
    const n = p.soundCount || 0;
    // 出声次数才是「这条链路确实通着」的证据：散布出来的一小时大半是静音，
    // 按此刻响不响判，正常的执行也会十次有九次被报成无声。
    if (n > 0) return [`响 ${n} 次 · ${fmt(on)}`, 'ok'];
    if (on < 120) return [`等待出声 · ${fmt(on)}`, ''];
    return [`播 ${Math.round(on / 60)} 分没出过声`, 'bad'];
  }
  // 用户自己按停的，不是故障。摆在「到点了没在播」前面，否则会拿红字骂人。
  if (inWindow && isPausedNow(s)) return ['已停这一次 · 可继续', ''];
  // 到点了却没有任何执行——以前完全看不见的那种失败：Mac 退了、睡着了、
  // 或者素材文件被挪走，8 点照样悄无声息地过去。
  if (inWindow && reportsRuns(p)) {
    const last = runsOf(s.id)[0];
    if (last && last.event === 'missing') return ['文件不在，没响', 'bad'];
    if (!open) return ['到点了 · 没在播', 'bad'];
    return ['已停 · 未收到结束', 'bt'];
  }
  if (inWindow) return ['正在响', 'ok'];        // 老版本 Mac：只能按时间说
  return [sayWhen(f), f && f.live ? 'ok' : ''];
}

/* 「上次到底响没响」。徽章说未来和现在，这一行说过去，各占一行。 */
function lastRunLine(id) {
  const rs = runsOf(id);
  // 收尾行才带结论；只有 start 说明那次执行没有善终（App 被退掉了之类）
  const r = rs.find(x => x.event !== 'start') || rs[0];
  if (!r) return ['还没执行过', ''];
  const when = cnTime(r.created);
  if (r.event === 'missing') return [`${when} 文件不在「${r.itemName || '?'}」`, 'bad'];
  if (r.event === 'failed') return [`${when} 播不出 · ${r.note || '失败'}`, 'bad'];
  if (r.event === 'start') return [`${when} 开始 · 没有结束记录`, ''];
  const n = r.soundCount || 0;
  return n > 0 ? [`${when} 响 ${n} 次 · ${fmt(r.playedFor)}`, 'ok']
               : [`${when} 一次没响 · ${fmt(r.playedFor)}`, 'bad'];
}

const RUN_WORDS = { start: '开始', end: '结束', missing: '文件不在', failed: '播不出' };

function runDetail(r) {
  if (r.event === 'end') {
    const n = r.soundCount || 0;
    return [n > 0 ? `响 ${n} 次 · 播了 ${fmt(r.playedFor)}` : `一次没响 · 播了 ${fmt(r.playedFor)}`,
            n > 0 ? '' : 'bad'];
  }
  if (r.event === 'start') return [`开始 · ${r.itemName || ''}`, ''];
  return [`${RUN_WORDS[r.event] || r.event}${r.itemName ? ' · ' + r.itemName : ''}`
          + (r.note ? ` · ${r.note}` : ''), 'bad'];
}

/* 规则的一行名字：日志筛选条和规则卡标题共用，两处各写一份就会叫不一样 */
const ruleHead = s => s.mode === 'window' ? `${s.startTime} → ${s.endTime}`
                    : s.mode === 'once' ? `${(s.date || '').slice(5)} ${s.startTime}` : s.startTime;

/* 规则行上说清楚会响哪几段：单段就是名字，多段是「甲 → 乙 +2」。
   完整清单进 title=，行上永远只有一行。 */
function ruleItems(s) {
  const list = Array.isArray(s.items) && s.items.length
    ? s.items : (s.itemName ? [{ name: s.itemName }] : []);
  if (!list.length) return '';
  if (list.length === 1) return list[0].name;
  return `${list[0].name} → ${list[1].name}` + (list.length > 2 ? ` +${list.length - 2}` : '');
}

function renderRules() {
  const box = $('#rules');
  if (!S.scheds.length) {
    box.innerHTML = '<div class="card"><div class="empty">还没有定时规则<br>新建一条，Mac 到点会自己响</div></div>';
    return;
  }
  const nowMin = cnParts(new Date()).minutes;
  const pct = m => (m / 14.4);            // 一天 1440 分钟 → 百分比
  const p = current();
  box.innerHTML = '';
  for (const s of S.scheds) {
    const f = nextFire(s);
    const start = hhmm(s.startTime) ?? 0;
    const head = ruleHead(s);
    const kind = s.mode === 'once' ? ' class="once"' : '';

    // 时段内分次播（0.23.0 起）：它的落点和 daily 一样是一串，不再是一整条。
    const split = s.mode === 'window' && (s.playSeconds || 0) > 0;

    // 24 小时缩略条：把「什么时候响」变成位置问题；跨午夜自动切两段
    let blocks = '';
    if (s.mode === 'window' && !split) {
      const end = hhmm(s.endTime) ?? start;
      blocks = end > start
        ? `<b${kind} style="left:${pct(start)}%;width:${pct(end - start)}%"></b>`
        : `<b${kind} style="left:${pct(start)}%;right:0"></b><b${kind} style="left:0;width:${pct(end)}%"></b>`;
    } else {
      // 画的是真正会响的落点（含波动），不是名义网格：这条带子存在的意义就是
      // 「什么时候响」，画成等间距等于把随机波动这件事又藏起来了。
      const sl = takeSlots({ ...s, enabled: true }, new Date());
      const wide = Math.max(0.5, pct((s.playSeconds || 60) / 60));
      const at = sl ? sl.at : [0];
      for (let i = 0; i < at.length && i < 60; i++)
        blocks += `<b${kind} style="left:${pct(start + at[i] / 60)}%;width:${wide}%"></b>`;
    }

    const period = (s.playSeconds || 0) + (s.gapSeconds || 0);
    // 时段内响几次是算出来的，所以写「约」——波动会让最后一次落在时段外而少一次。
    const times = split ? `约 ${windowRounds(s)}` : (s.repeatCount || 1);
    const badges = s.mode === 'window' && !split
      ? '<span class="badge">持续</span>'
      : `<span class="badge">${secs(s.playSeconds || 0)}</span><span class="badge">× ${times}</span>`
        + (split || (s.repeatCount || 1) > 1 ? `<span class="badge">每隔 ${secs(period)}</span>` : '')
        + (s.jitterSeconds ? `<span class="badge">± ${secs(s.jitterSeconds)}</span>` : '')
        + (s.continuous ? '<span class="badge">接着往下</span>' : '');

    const days = s.mode === 'once' ? ''
      : `<div class="days">${DAYS.map((d, i) =>
          `<i class="${!s.weekdays || !s.weekdays.length || s.weekdays.includes(i + 1) ? 'on' : ''}">${d}</i>`
        ).join('')}</div>`;

    const [btext, bkind] = s.enabled ? ruleBadge(s, f, p) : ['已停用', ''];
    // 「停这一次」只在这一次真的在窗内时出现：它作用于一个具体的时刻，
    // 窗外按下去没有对象。停用是「以后都别响」，两件事，两个按钮。
    const takeAt = s.enabled && canPause(p) ? currentTakeAt(s) : null;
    const paused = takeAt != null && isPausedNow(s);
    const pauseBtn = takeAt == null ? ''
      : paused
        ? '<button class="mini acc" data-a="p" title="从此刻该在的位置接着播，不是从头开始">继续</button>'
        : '<button class="mini" data-a="p" title="只停这一次，下一次和明天都照常">停这一次</button>';
    const [htext, hkind] = lastRunLine(s.id);
    const history = runsOf(s.id);
    const opened = S.openHist === s.id;

    const el = document.createElement('div');
    el.className = 'rule' + (s.enabled && !(f && f.expired) ? '' : ' dim');
    el.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div class="rtime num">${esc(head)}</div>
          <div class="rbadges">${badges}</div>
        </div>
        <span class="badge ${bkind}">${esc(btext)}</span>
      </div>
      <div class="strip">${blocks}<u style="left:${pct(nowMin)}%"></u></div>
      ${days}
      <div class="hist ${hkind}" data-a="h" title="最近这条规则真的响了没有">
        <span class="dot"></span><b>${esc(htext)}</b><span class="grow"></span>
        ${history.length ? `<span class="chev">${opened ? '收起' : history.length + ' 条'}</span>` : ''}
      </div>
      ${opened && history.length ? `<div class="runs">${history.slice(0, 12).map(r => {
        const [txt, kind] = runDetail(r);
        return `<div><span class="num">${esc(cnTime(r.created))}</span>`
             + `<span class="what ${kind}">${esc(txt)}</span></div>`;
      }).join('')}</div>` : ''}
      <div style="display:flex;gap:8px;margin-top:12px">
        ${pauseBtn}
        <button class="mini" data-a="e">修改</button>
        <button class="mini" data-a="t" title="${s.enabled ? '这条规则以后都不响了，包括正在播的这次' : '恢复这条规则'}">${s.enabled ? '停用' : '启用'}</button>
        <button class="mini" data-a="d">删除</button>
        <span class="grow"></span>
        <span class="cap" style="align-self:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ruleItems(s))}</span>
      </div>`;
    el.querySelector('[data-a=h]').onclick = () => {
      S.openHist = opened ? null : s.id;
      renderRules();
    };
    el.querySelector('[data-a=e]').onclick = () => openSheet(s);
    if (takeAt != null) {
      el.querySelector('[data-a=p]').onclick = () =>
        api(`/api/collections/ss_schedules/records/${s.id}`, { method: 'PATCH',
            body: JSON.stringify({ pausedTake: paused ? 0 : takeAt }) }).then(loadScheds);
    }
    el.querySelector('[data-a=t]').onclick = () =>
      api(`/api/collections/ss_schedules/records/${s.id}`,
          { method: 'PATCH', body: JSON.stringify({ enabled: !s.enabled }) }).then(loadScheds);
    el.querySelector('[data-a=d]').onclick = () =>
      api(`/api/collections/ss_schedules/records/${s.id}`, { method: 'DELETE' }).then(loadScheds);
    box.appendChild(el);
  }
}

/* ---------- 日志 ----------
 *
 * 「几点放了什么、响了几次」——事后查账的那一页。规则卡只答「这条规则最近怎么样」，
 * 想按时间查就得挨条点开；这里把同一份 ss_runs 按天铺开，跨规则按时间排。
 *
 * 一次执行(take)配成一行：start 开、end/failed 收。missing 单独一行——
 * 它是那种本来完全静默的失败（RunLog 里第一段就不在时连 start 都不开）。
 * 这里只是配对与展示，怎么开合是 Mac 端 RunLog 状态机定的，别在这边另立判断。 */
function takeRows() {
  const open = {};                                   // schedule id → 还没收尾的 start 行
  const out = [];
  for (let i = S.runs.length - 1; i >= 0; i--) {     // S.runs 新的在前，倒着走成时间正序
    const r = S.runs[i];
    if (r.event === 'start') {
      // 同一条规则又开了一次，上一次却没收尾 = App 中途被退掉/断电
      if (open[r.schedule]) out.push({ at: pbDate(open[r.schedule].created).getTime(),
                                       start: open[r.schedule], dead: true });
      open[r.schedule] = r;
    } else if (r.event === 'missing') {
      out.push({ at: pbDate(r.created).getTime(), miss: r });
    } else {                                         // end / failed：收掉开着的那次
      const s = open[r.schedule]; delete open[r.schedule];
      // start 被 200 行修剪掉时，从收尾行倒推开始时刻——playedFor 就是播了多久
      out.push(s ? { at: pbDate(s.created).getTime(), start: s, end: r }
                 : { at: pbDate(r.created).getTime() - (r.playedFor || 0) * 1000, end: r });
    }
  }
  for (const id in open) out.push({ at: pbDate(open[id].created).getTime(), start: open[id] });
  return out.sort((a, b) => b.at - a.at);
}

/* 一行的结论。名字取开始时那段；清单播到别段收尾就写成「甲 → 乙」。 */
function logRow(t) {
  if (t.miss) return { name: t.miss.itemName || '?', res: '文件不在，没响', kind: 'bad',
                       tip: t.miss.localPath || '' };
  if (t.end) {
    const from = t.start ? t.start.itemName : t.end.itemName;
    const name = t.start && t.end.itemName && t.end.itemName !== t.start.itemName
      ? `${from} → ${t.end.itemName}` : from;
    if (t.end.event === 'failed')
      return { name, res: '播不出', kind: 'bad', tip: t.end.note || '' };
    const n = t.end.soundCount || 0;
    return { name, res: `${n > 0 ? `响 ${n} 次` : '一次没响'} · ${fmt(t.end.playedFor)}`,
             kind: n > 0 ? 'ok' : 'bad', tip: '' };
  }
  // 只有 start：要么此刻正在播，要么那次执行没有善终
  const sch = S.scheds.find(x => x.id === t.start.schedule);
  const p = current();
  if (!t.dead && sch && liveTake(sch) && p && isLive(p) && p.state === 'playing')
    return { name: t.start.itemName, res: `正在播 · ${fmt((Date.now() - t.at) / 1000)}`,
             kind: 'acc', tip: '' };
  return { name: t.start.itemName, res: '没有结束记录', kind: '',
           tip: '执行中 App 被退出或断电，就会缺结束行' };
}

function renderLog() {
  const box = $('#log'), bar = $('#logRules'), p = current();

  // 筛选条：只有一条规则时没有可查的维度，整条藏起来
  const withRuns = S.scheds.filter(s => S.runs.some(r => r.schedule === s.id));
  if (withRuns.length > 1) {
    bar.classList.remove('hide');
    bar.innerHTML = '';
    const mk = (label, id, tip) => {
      const b = document.createElement('button');
      b.className = 'chip' + (S.logRule === id ? ' sel' : '');
      b.textContent = label;
      if (tip) b.title = tip;
      b.onclick = () => { S.logRule = id; renderLog(); };
      bar.appendChild(b);
    };
    mk('全部', '');
    for (const s of withRuns) mk(ruleHead(s), s.id, ruleItems(s));
  } else { bar.classList.add('hide'); S.logRule = ''; }

  let rows = takeRows();
  if (S.logRule) rows = rows.filter(t => (t.miss || t.start || t.end).schedule === S.logRule);
  if (!rows.length) {
    box.innerHTML = `<div class="card"><div class="empty">${
      p && !reportsRuns(p)
        ? '这台 Mac 的声拼太旧，不写执行日志<br>在 Mac 上「检查更新」升级到 0.18.0 以上'
        : '还没有定时执行记录<br><span title="定时是唯一没人在场的功能，所以才要记账；手动点播时你就在跟前">只记定时，手动点播不记录</span>'}</div></div>`;
    return;
  }

  // 按东八区的日子分组；行里只写钟点，是哪天由卡头说
  const today = cnParts(new Date()).date;
  const yday = cnParts(new Date(Date.now() - 86400000)).date;
  const groups = [];
  for (const t of rows) {
    const cp = cnParts(new Date(t.at));
    if (!groups.length || groups[groups.length - 1].date !== cp.date)
      groups.push({ date: cp.date, wd: cp.weekday, rows: [] });
    groups[groups.length - 1].rows.push({ ...t, min: cp.minutes });
  }
  box.innerHTML = groups.map(g => {
    const label = g.date === today ? '今天' : g.date === yday ? '昨天'
                : `${g.date.slice(5)} 周${DAYS[g.wd - 1]}`;
    // 「次」数的是执行，不数 missing 那种附属行：一次执行途中跳过一段会写两行，
    // 按行数就把同一次数成了两次。
    const takes = g.rows.filter(t => t.start || t.end).length;
    return `<div class="card"><div class="lday"><span>${esc(label)}</span>`
      + `<span class="grow"></span><span class="num">${takes} 次</span></div>`
      + g.rows.map(t => {
          const r = logRow(t);
          const sch = S.scheds.find(x => x.id === (t.miss || t.start || t.end).schedule);
          const tip = [sch ? `规则 ${ruleHead(sch)}` : '', r.tip].filter(Boolean).join(' · ');
          return `<div class="lrow" title="${esc(tip)}"><span class="ltime num">${clock(t.min)}</span>`
            + `<span class="lname">${esc(r.name)}</span>`
            + `<span class="lres ${r.kind}">${esc(r.res)}</span></div>`;
        }).join('')
      + '</div>';
  }).join('');
}

/* ---------- 新建规则 ---------- */
/* 🔴 period 是「开始到开始」，不是「上次结束到下次开始」。
 * 存进去的 gapSeconds 仍是后者（Mac 端的语义没变），保存时换算。
 * 以前这一栏叫「间隔」，填 1 小时实际周期是 1 小时零 30 秒——「每隔 1 小时」
 * 是用户说的话，就该是用户填的数。 */
const F = { mode: 'daily', play: 30, rep: 3, period: 120, jitter: 0, cont: false,
            days: [], pick: [], editing: null, dropped: 0 };
/* 秒数按档跳，不弹键盘也不用滑块（3e）。每一栏的量级差得很远，共用一张表
 * 会让「每隔」从 10 分一步跳到 30 分，也让「波动」一路能拨到几小时。 */
const STEPS = {
  play:   [0, 5, 10, 15, 30, 60, 120, 300, 600, 1800, 3600],   // 0 = 不限
  period: [30, 60, 120, 300, 600, 900, 1800, 2700, 3600, 5400, 7200, 10800, 21600, 43200],
  jitter: [0, 15, 30, 60, 120, 300, 600, 900, 1800],
};
function stepVal(key, v, d) {
  const t = STEPS[key];
  if (d > 0) return t.find(x => x > v) ?? t[t.length - 1];
  const below = t.filter(x => x < v);
  return below.length ? below[below.length - 1] : t[0];
}
/* 「3600 s」认不出是一小时。读数一律说人话，全精度只留给机器看的地方。 */
const secs = v => {
  v = Math.round(v || 0);
  if (v < 60) return v + ' 秒';
  const m = Math.round(v / 60);
  if (m < 60) return m + ' 分';
  const h = (m / 60) | 0, r = m % 60;
  return r ? `${h} 小时 ${r} 分` : `${h} 小时`;
};

/* ---------- 定时播什么 ----------
 *
 * 以前这是隐式的：保存时抓「当前选中的那个成品」，屏幕上没有任何一处说这条规则
 * 会响哪一段。现在明选，而且多选按**点选顺序**连着放——所以序号是有意义的，
 * 圆点里放的是次序而不是一个勾。
 */
function renderPick() {
  const box = $('#pickList');
  box.innerHTML = '';
  for (const it of S.items) {
    const at = F.pick.indexOf(it.id);
    const b = document.createElement('button');
    b.className = 'pick' + (at >= 0 ? ' on' : '');
    b.innerHTML = `<span class="ord">${at >= 0 ? at + 1 : ''}</span>
      <span class="pname">${esc(it.name)}</span>
      <span class="plen num">${fmt(it.duration)}</span>`;
    b.onclick = () => {
      const i = F.pick.indexOf(it.id);
      if (i >= 0) F.pick.splice(i, 1); else F.pick.push(it.id);
      renderPick(); syncSheet();
    };
    box.appendChild(b);
  }
  const chosen = pickedItems();
  const total = chosen.reduce((s, i) => s + (i.duration || 0), 0);
  $('#pickCap').textContent = chosen.length
    ? `播放内容 · 已选 ${chosen.length} 段 · 共 ${fmt(total)}`
    : '播放内容 · 点一下选中，可多选（按点选顺序连着放）';
}

const pickedItems = () => F.pick.map(id => S.items.find(i => i.id === id)).filter(Boolean);

/* 打开表单。传一条规则进来就是修改它，不传就是新建。
 *
 * 同一个弹窗两用而不是复制一份：新建和修改是同一组字段、同一套换算、同一行结论，
 * 分成两份就会在其中一份里漏掉「每隔是周期不是间隔」这类换算。 */
function openSheet(rule) {
  if (!S.items.length && !rule) { $('#sheetErr').textContent = ''; setTab('now'); return; }
  $('#sheetErr').textContent = '';
  F.editing = rule ? rule.id : null;
  $('#sheetTitle').textContent = rule ? '修改定时' : '新建定时';
  $('#saveRule').textContent = rule ? '保存修改' : '保存';

  if (rule) {
    F.mode = rule.mode || 'daily';
    // 存的是多少就填多少：|| 30 会把「不限（0）」悄悄改成 30 秒，
    // 用户只是打开看一眼再保存，规则就变了。
    F.play = Number(rule.playSeconds) || 0;
    F.rep = rule.repeatCount || 1;
    // 存的是「上次结束→下次开始」，表单问的是「开始→开始」，在这里换回去
    F.period = (rule.playSeconds || 0) + (rule.gapSeconds || 0);
    F.jitter = rule.jitterSeconds || 0;
    F.cont = !!rule.continuous;
    F.days = [...(rule.weekdays || [])];
    // 素材可能已经被移除了：留着一个指向不存在条目的勾，保存时会写出一条播不响
    // 的规则。滤掉，并在结论行里说这件事。
    const listed = (rule.items && rule.items.length ? rule.items
                    : (rule.item ? [{ id: rule.item }] : []));
    F.pick = listed.map(i => i.id).filter(id => S.items.some(x => x.id === id));
    F.dropped = listed.length - F.pick.length;
    $('#fDate').value = rule.date || cnParts(new Date()).date;
    $('#fStart').value = rule.startTime || '22:00';
    $('#fEnd').value = rule.endTime || '23:00';
  } else {
    F.mode = 'daily'; F.play = 30; F.rep = 3; F.period = 120; F.jitter = 0;
    F.cont = false; F.days = []; F.dropped = 0;
    $('#fDate').value = cnParts(new Date()).date;
    // 开局带上「现在」页选中的那一段，保留原来的顺手，但现在它是看得见的。
    F.pick = S.selItem && S.items.some(i => i.id === S.selItem) ? [S.selItem] : [];
  }
  $('#shStart').textContent = $('#fStart').value;
  $('#shEnd').textContent = $('#fEnd').value;
  [...$('#mSeg').children].forEach(x => x.classList.toggle('sel', x.dataset.m === F.mode));

  renderPick();
  syncSheet();
  // 上一次滚到哪儿了不该带到下一次：打开时该看到的是第一栏「播放内容」。
  $('#sheet').querySelector('.sbody').scrollTop = 0;
  $('#sheet').classList.remove('scrolled');   // 归零不触发 scroll 事件
  $('#scrim').classList.remove('hide'); $('#sheet').classList.remove('hide');
  requestAnimationFrame(() => { $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); });
}
function closeSheet() {
  $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show');
  setTimeout(() => { $('#scrim').classList.add('hide'); $('#sheet').classList.add('hide'); }, 320);
}
// 包一层：onclick 会把事件对象当第一个参数传进去，那会被当成「要修改的规则」
// 滚起来了才给标题一条底线：固定的头和滚动的内容之间需要一道边界，
// 而没滚的时候画一条线只是多一道横杠。
{
  const sb = $('#sheet').querySelector('.sbody');
  sb.addEventListener('scroll',
    () => $('#sheet').classList.toggle('scrolled', sb.scrollTop > 2), { passive: true });
}
$('#addRule').onclick = () => openSheet();
$('#cancelRule').onclick = closeSheet;
// 遮罩关的是「当前开着的那一层」，不是固定某一个。
$('#scrim').onclick = () => {
  if (!$('#itemSheet').classList.contains('hide')) return closeItemSheet();
  if (!$('#devSheet').classList.contains('hide')) return closeDevSheet();
  if (!$('#outSheet').classList.contains('hide')) return closeOutSheet();
  closeSheet();
};

$('#mSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  F.mode = b.dataset.m;
  [...$('#mSeg').children].forEach(x => x.classList.toggle('sel', x === b));
  syncSheet();
};
$('#fStart').oninput = e => { $('#shStart').textContent = e.target.value; syncSheet(); };
$('#fEnd').oninput = e => { $('#shEnd').textContent = e.target.value; syncSheet(); };
$('#fDate').oninput = syncSheet;

document.querySelectorAll('.stepper button').forEach(b => b.onclick = () => {
  const k = b.dataset.s, d = +b.dataset.d;
  if (k === 'rep') F.rep = Math.max(1, Math.min(99, F.rep + d));
  else F[k] = stepVal(k, F[k], d);
  // 周期短于单次时长就没有周期可言了，把它顶上去而不是留个说不通的组合
  if (F.period < F.play) F.period = STEPS.period.find(x => x >= F.play) ?? F.play;
  syncSheet();
});

$('#fCont').onclick = () => { F.cont = !F.cont; syncSheet(); };

$('#dayPick').innerHTML = DAYS.map((d, i) => `<button data-d="${i + 1}"><i>${d}</i></button>`).join('');
$('#dayPick').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = +b.dataset.d;
  F.days = F.days.includes(d) ? F.days.filter(x => x !== d) : [...F.days, d];
  syncSheet();
};

/* 不适用的字段整组消失，而不是灰着占位（3e） */
function syncSheet() {
  const win = F.mode === 'window';
  // 时段模式在 0.23.0 之前只有「整段循环」一种，那些机器上给出这几栏
  // 等于给个假开关：它们收到 playSeconds 也照样循环整段。
  const split = win && splitsWindow(current());
  $('#rowDate').classList.toggle('hide', F.mode !== 'once');
  $('#rowEnd').classList.toggle('hide', !win);
  $('#grpTake').classList.toggle('hide', win && !split);
  // 时段内响几次是从时段长度算出来的，不是填的——留着它就成了一个填了不算数的框。
  $('#rowRep').classList.toggle('hide', win);
  $('#grpDays').classList.toggle('hide', F.mode === 'once');
  $('#labStart').textContent = win ? '开始' : '时间';
  // 步进器读数只有 64px：说清楚「不限」就够，是循环还是放完由下面那行结论说。
  $('#vPlay').textContent = F.play ? secs(F.play) : '不限';
  $('#vRep').textContent = F.rep + ' 次';
  $('#vGap').textContent = secs(F.period);
  $('#vJit').textContent = F.jitter ? '± ' + secs(F.jitter) : '不波动';
  // 每次都整条放完的话，「接着上次」没有对象——这一栏只在限了时长时才成立。
  // 还要服务端真的有这个字段：PocketBase 会**静默丢掉** schema 之外的字段，
  // 少加一个字段就变成一个按了没反应的开关，而两边都不报错。
  const canCont = F.play > 0 && canContinue(current()) && contFieldReady();
  $('#rowCont').classList.toggle('hide', !canCont);
  $('#fCont').textContent = F.cont ? '接着往下' : '从头';
  $('#fCont').classList.toggle('acc', F.cont);
  [...$('#dayPick').children].forEach(b => b.classList.toggle('on', F.days.includes(+b.dataset.d)));

  // 底部实时结论：保存前就能确认，代替所有说明文字。
  // 用一条和保存时一模一样的规则去算，否则预告和实际会各说各话。
  const draft = draftRule();
  const f = nextFire(draft);
  const jit = F.jitter ? ` · 前后 ±${secs(F.jitter)} 随机` : '';
  // 时段内分次播时，响几次是算出来的——这正是用户没法自己心算的那个数。
  const rounds = win && F.play > 0 ? windowRounds(draft) : 0;
  const how = win
    ? (F.play > 0 ? `${secs(F.play)} × 约 ${rounds} 次 · 每隔 ${secs(F.period)}${jit}`
                  : '持续到结束时间')
    : F.play > 0
      ? `${secs(F.play)} × ${F.rep} 次` + (F.rep > 1 ? ` · 每隔 ${secs(F.period)}` : '') + jit
      : `一次放完${jit}`;
  // 一行结论：什么时候响、放什么、放不放得完。够不够放是这里唯一值得算的事——
  // 差额靠循环补上，用户不该自己去做这道减法。
  const chosen = pickedItems();
  const total = chosen.reduce((a, i) => a + (i.duration || 0), 0);
  const names = chosen.map(i => i.name).join(' → ') || '未选内容';
  const fit = !total ? ''
            : !F.play ? (win ? '循环到时段结束' : `共 ${fmt(total)}，放完为止`)
            : F.play > total ? `共 ${fmt(total)}，不够 ${fmt(F.play)}，会循环滚动`
            : draft.continuous ? `共 ${fmt(total)}，今天从 ${fmt(consumedAt(draft, 0) % total)} 起往下`
            : `共 ${fmt(total)}，每次到 ${fmt(F.play)} 就停`;
  // 改一条正在播的规则会当场重来（Mac 每 0.5 s 按新规则重算落点），不是等这次放完。
  // 这是唯一一个「按下保存会立刻发出声音变化」的情况，所以它自己一行、红字。
  const nowLive = F.editing && S.scheds.some(x => x.id === F.editing && liveTake(x));
  const warn = nowLive
    ? '<br><span style="font-size:12px;color:var(--badText)">这条正在播 · 保存后立刻按新设置重来</span>'
    : '';
  const lost = F.dropped > 0
    ? `<br><span style="font-size:12px;color:var(--badText)">原有 ${F.dropped} 段已不在可播清单里，已去掉</span>` : '';
  // 正在响的时候不能再套「首次将在…响」的壳子，那读出来是「正在响 响」。
  const lead = f && f.live ? '' : (F.editing ? '下次将在 ' : '首次将在 ');
  const tail = f && f.live ? '' : ' 响';
  $('#verdict').innerHTML = f
    ? `${lead}<b>${esc(sayWhen(f))}</b>${tail} · ${esc(how)}<br>
       <span style="font-size:12px;color:var(--t3)">${esc(names)}${fit ? ' · ' + esc(fit) : ''}</span>${warn}${lost}`
    : '<b>不会触发</b> · 检查日期或星期' + lost;
}

/* 表单当前状态 → 一条规则。预告和保存共用它，两边就不可能算出不同的东西。
   id 只影响波动的种子；新建时还没有 id，用一个占位的，预告出来的分秒会和
   保存后差一点——这是**没法消除**的（种子必须来自服务端发的 id），所以预告
   里说的是「前后 ±5 分随机」，不是一个精确到秒的假时刻。 */
function draftRule(id = F.editing || 'draft') {
  return {
    id, enabled: true, localPath: (pickedItems()[0] || {}).localPath || '/x',
    mode: F.mode, date: $('#fDate').value,
    startTime: $('#fStart').value, endTime: $('#fEnd').value,
    weekdays: F.days, playSeconds: F.play, repeatCount: F.rep,
    gapSeconds: Math.max(0, F.period - F.play), jitterSeconds: F.jitter,
    // created 决定「已经跑过几天」，预告时用现有规则的，新建的就是今天
    continuous: F.cont && F.play > 0,
    created: (S.scheds.find(x => x.id === F.editing) || {}).created || new Date().toISOString(),
  };
}

$('#saveRule').onclick = async () => {
  $('#sheetErr').textContent = '';
  const chosen = pickedItems();
  if (!chosen.length) { $('#sheetErr').textContent = '先选要播放的内容'; return; }
  const it = chosen[0];
  const body = {
    player: S.sel, item: it.id, itemName: it.name, localPath: it.localPath,
    // items 是事实源；itemName / localPath 留着，老版本 Mac 只认得它们，
    // 至少还能播到第一段而不是彻底不响。
    items: chosen.map(i => ({ id: i.id, name: i.name,
                              localPath: i.localPath, duration: i.duration || 0 })),
    mode: F.mode, date: $('#fDate').value,
    startTime: $('#fStart').value, endTime: $('#fEnd').value,
    weekdays: [...F.days].sort((a, b) => a - b),
    continuous: F.cont && F.play > 0,
    // 存的仍是「上次结束到下次开始」——Mac 端语义没动，换算放在这一处
    playSeconds: F.play, repeatCount: F.rep,
    gapSeconds: Math.max(0, F.period - F.play), jitterSeconds: F.jitter,
  };
  try {
    if (F.editing) {
      // 不写 enabled：停用中的规则改完不该被偷偷打开，那是另一个按钮的事
      await api(`/api/collections/ss_schedules/records/${F.editing}`,
                { method: 'PATCH', body: JSON.stringify(body) });
    } else {
      await api('/api/collections/ss_schedules/records',
                { method: 'POST', body: JSON.stringify({ ...body, enabled: true }) });
    }
    closeSheet(); loadScheds();
  } catch (e) { $('#sheetErr').textContent = String(e.message || e); }
};

/* ---------- 实时 ---------- */
/* EventSource 不能自定义请求头，也不需要：PocketBase 的 SSE 连接本身匿名，
 * 认证靠随后那个带 Authorization 的订阅 POST 绑定 clientId。这也是它能跨域的原因。 */
function connectRealtime() {
  if (S.es) S.es.close();
  const es = new EventSource(S.url + '/api/realtime');
  S.es = es;
  es.addEventListener('PB_CONNECT', async ev => {
    S.retries = 0;
    await api('/api/realtime', { method: 'POST', body: JSON.stringify({
      clientId: JSON.parse(ev.data).clientId,
      subscriptions: ['ss_players', 'ss_items', 'ss_schedules', 'ss_runs', 'ss_shared',
                      'ss_commands'] }) });
    setLink('已连接', 'ok');
    // 🔴 重连之后必须重新拉一遍。
    //
    // 订阅只保证「从现在起」的事件；断开期间发生的一切没有补发。以前这里只重新
    // 订阅、不重新读，于是断线时新增的成品在页面上**永远**不会出现——用户在 Mac 上
    // 加了一个文件，控制端就是不显示，除非切一次设备或整页刷新。
    // 手机上这是常态而不是意外：PWA 一进后台连接就断。
    refreshAll();
  });
  es.addEventListener('ss_players', ev => {
    const { action, record } = JSON.parse(ev.data);
    const i = S.players.findIndex(p => p.id === record.id);
    if (action === 'delete') { if (i >= 0) S.players.splice(i, 1); }
    else if (i >= 0) S.players[i] = record; else S.players.push(record);
    if (!S.sel) S.sel = record.id;
    notePos(current());
    renderChips(); renderNow();
  });
  es.addEventListener('ss_items', () => { if (S.sel) loadItems(); });
  es.addEventListener('ss_shared', () => { loadShared().catch(() => {}); });
  es.addEventListener('ss_schedules', () => { if (S.sel) loadScheds(); });
  // 一次定时开播 / 收尾就是一行——收到就重读，规则卡上的「正在播」和「上次响没响」
  // 才会在事情发生的那一刻变，而不是等到下一次 45 秒轮询。
  es.addEventListener('ss_runs', () => { if (S.sel && S.tab !== 'now') loadScheds(); });
  // 指令回执：Mac 一写 done/failed，徽标当场就变，不必等下一拍轮询。
  // 🔴 收到的是**全账号**的指令（PB 的 realtime `?filter=` 实测不生效），
  // 自己核对 id —— 和 Mac 端硬核对 player 是同一个道理。`settleCommand` 里判。
  es.addEventListener('ss_commands', ev => {
    const { action, record } = JSON.parse(ev.data);
    if (action !== 'delete') settleCommand(record);
  });
  es.onerror = () => setLink(`重连中 · 第 ${++S.retries} 次`, 'bt');
}
function setLink(text, kind) {
  $('#link').className = 'badge' + (kind ? ' ' + kind : '');
  $('#link').textContent = text;
}

/* 断线期间的变化没有补发，所以除了重连，还有两个补读的时机：
 *   回到前台 —— 手机上 PWA 一进后台连接就断，回来时未必立刻重连
 *   慢轮询   —— SSE 可以「看起来还连着」却已经不送数据了（iOS 上常见），
 *               只靠事件的话没有任何东西会发现这件事
 * 都走同一个 refreshAll，重复调用无害。 */
function refreshAll() {
  if (!S.token) return;
  loadPlayers().catch(() => {});
  // 订阅只送「从现在起」的事件：断开期间别的机器传上来的共享条目，
  // 不在这里补读就永远不会出现——和成品列表同一个坑。
  loadShared().catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll(); });
setInterval(refreshAll, 45000);

/* 1 秒一拍，因为播放中的进度是本地推进的（见 shownPosition）。
 * 其余的每 5 拍再刷：掉线的机器不该一直亮着绿点，规则上的「下一次」和
 * 当前时刻线也要跟着走，但这些一秒一次是白费。 */
let uiTick = 0;
setInterval(() => {
  renderNow();
  if (++uiTick % 5 === 0) {
    renderChips();
    if (S.tab === 'sched') renderRules();
    if (S.tab === 'log') renderLog();      // 「正在播 · 4:12」那行要跟着走
  }
}, 1000);

/* ---------- 不缩放 ---------- */
/* iOS 的捏合缩放是 WebKit 私有的 gesture 事件，viewport 的 user-scalable=no
 * 在 Safari 里早就被忽略了；只有把这三个事件按住才真的不缩放。 */
for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
  document.addEventListener(t, e => e.preventDefault(), { passive: false });

/* 双击放大：touch-action 已经挡掉大部分，但 iOS 在部分元素上仍会触发，
 * 300 ms 内的第二次点击直接吃掉。单击不受影响。 */
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });

if (S.token) start();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
