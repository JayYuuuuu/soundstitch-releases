<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>声拼 · 控制台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 设计稿 3f 组件规格 —— 改样式先改这里，别在结构里写死值。 */
:root{
  --accent:#0A6CFF; --ok:#34C759; --bt:#FF9F0A; --bad:#FF3B30; --once:#AF52DE; --off:#8E8E93;
  --bg:#F2F2F7; --card:#FFF; --card2:#F7F7F8; --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.14);
  --t1:#1D1D1F; --t2:#6E6E73; --t3:#8A8A8E;
  --okText:#248A3D; --badText:#C42B21; --accText:#0A4FA3; --btText:#B4700A;
}
@media (prefers-color-scheme:dark){
  :root{--accent:#0A84FF; --ok:#30D158; --bad:#FF453A;
        --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --line:rgba(255,255,255,.10);
        --line2:rgba(255,255,255,.16); --t1:#F2F2F7; --t2:#C7C7CC; --t3:#8E8E93;
        --okText:#30D158; --badText:#FF453A; --accText:#0A84FF; --btText:#FF9F0A}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 装到桌面后要像原生 App：不缩放。
 * 双指缩放和双击放大是两套机制，得分别堵：
 *   touch-action:pan-y  —— 只允许纵向滚动，顺带干掉双击放大
 *   gesture* 事件       —— iOS 的捏合走的是 WebKit 私有事件，
 *                          光靠 viewport 的 user-scalable=no 拦不住
 * 横向滚动的设备条和滑块各自声明自己需要的方向，否则会被一起锁死。 */
html,body{margin:0;height:100%;touch-action:pan-y;-webkit-text-size-adjust:100%}
.chips{touch-action:pan-x}
input[type=range]{touch-action:none}
main,.sheet{touch-action:pan-y}
body{background:var(--bg);color:var(--t1);
  font:14px/1.5 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.mono,.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.hide{display:none !important}
.grow{flex:1}

#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative}
.safe{padding-top:max(env(safe-area-inset-top),12px)}
.bar{padding:0 16px 10px;display:flex;align-items:center;gap:8px}
.bar h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}

/* 设备 chip 条常驻：换机一步，视线不动（3a） */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:18px;display:flex;align-items:center;
      gap:7px;background:var(--card);border:.5px solid var(--line2);font-size:14px;font-weight:500;
      white-space:nowrap;transition:background .18s ease-out,color .18s ease-out}
.chip.sel{background:var(--accent);border-color:transparent;color:#fff}
.chip.off{color:var(--off)}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.chip.off .cdot{background:#C7C7CC}
.chip.sel .cdot{background:rgba(255,255,255,.9)}

main{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.cap{font-size:11px;font-weight:600;color:var(--t3)}

/* 状态一律靠徽标表达，不写句子 */
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--line);
       color:var(--t2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
       transition:background .14s,color .14s}
.badge.ok{background:rgba(52,199,89,.16);color:var(--okText)}
.badge.bt{background:rgba(255,159,10,.18);color:var(--btText)}
.badge.bad{background:rgba(255,59,48,.12);color:var(--badText)}
.badge.acc{background:rgba(10,108,255,.14);color:var(--accText)}

.now-name{font-size:17px;font-weight:600}
.now-out{font-size:13px;color:var(--t2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.track{height:4px;border-radius:2px;background:var(--line);margin:14px 0 6px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s linear}
.times{display:flex;font-size:12px;color:var(--t3)}
.keys{display:flex;align-items:center;justify-content:center;gap:22px;margin:16px 0 6px}
.key{width:56px;height:56px;border-radius:50%;background:var(--card2);display:flex;
     align-items:center;justify-content:center;transition:transform 90ms cubic-bezier(.2,0,.4,1)}
.key.main{width:72px;height:72px;background:var(--accent)}
.key:active{transform:scale(.92)}
.key svg{width:24px;height:24px;fill:var(--t1)}
.key.main svg{width:30px;height:30px;fill:#fff}
.shake{animation:shake 260ms ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
                 50%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.spin{animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=range]{width:100%;accent-color:var(--accent);height:44px}

.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0}
.row+.row{border-top:.5px solid var(--line)}
.rowmain{flex:1;min-width:0}
.rowsub{font-size:13px;color:var(--t2);margin-top:2px}
.empty{text-align:center;padding:28px 8px;color:var(--t3);font-size:13px;line-height:1.7}
.mini{height:40px;min-width:44px;padding:0 14px;border-radius:9px;background:var(--card2);
      font-size:14px;font-weight:500}
.mini.acc{background:var(--accent);color:#fff}

/* 定时规则：时间当主角，24 小时条把「什么时候」变成位置问题（3e） */
.rule{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.rule.dim{opacity:.55}
.rtime{font-size:19px;font-weight:700;letter-spacing:-.01em}
.rbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.strip{position:relative;height:16px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.strip>b{position:absolute;top:2px;bottom:2px;background:var(--accent);border-radius:2px;min-width:2px}
.strip>b.once{background:var(--once)}
.strip>u{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.days{display:flex;gap:5px;margin-top:10px}
.days i{width:19px;height:19px;border-radius:50%;background:var(--line);font-style:normal;
        font-size:10px;font-weight:600;color:var(--t3);display:flex;align-items:center;justify-content:center}
.days i.on{background:var(--accent);color:#fff}

nav{flex:none;display:flex;border-top:.5px solid var(--line);background:var(--card);
    padding-bottom:max(env(safe-area-inset-bottom),20px)}
nav button{flex:1;height:63px;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:3px;color:var(--t3);font-size:10px;font-weight:600}
nav button.sel{color:var(--accent)}
nav svg{width:22px;height:22px;fill:currentColor}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;opacity:0;transition:opacity .32s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);
       border-radius:26px 26px 0 0;padding:8px 16px max(env(safe-area-inset-bottom),20px);
       max-width:480px;margin:0 auto;max-height:90dvh;overflow-y:auto;
       transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.show{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h2{font-size:17px;font-weight:600;margin:0 0 14px}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:36px;border-radius:7px;font-size:13px;font-weight:500;color:var(--t2)}
.seg button.sel{background:var(--card);color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fcard{background:var(--card);border-radius:12px;padding:0 14px;margin-bottom:12px}
.frow{display:flex;align-items:center;min-height:60px;gap:12px}
.frow+.frow{border-top:.5px solid var(--line)}
.flabel{font-size:15px;font-weight:500;flex:1}
.timeblock{position:relative;width:88px;height:76px;border-radius:12px;background:var(--card2);
           display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.timeblock b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.timeblock s{font-size:10px;color:var(--t3);text-decoration:none}
.timeblock input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:44px;height:44px;border-radius:9px;background:var(--card2);
                font-size:20px;font-weight:400}
.stepper span{min-width:64px;text-align:center;font-size:17px;font-weight:600}
.daypick{display:flex;gap:2px;padding:8px 0 12px}
.daypick button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.daypick i{width:32px;height:32px;border-radius:50%;background:var(--card2);font-style:normal;
           font-size:13px;font-weight:600;color:var(--t2);display:flex;align-items:center;justify-content:center}
.daypick button.on i{background:var(--accent);color:#fff}
.verdict{font-size:14px;color:var(--t2);text-align:center;padding:2px 0 14px;line-height:1.6}
.verdict b{color:var(--t1);font-weight:600}
.primary{width:100%;height:52px;border-radius:12px;background:var(--accent);color:#fff;
         font-size:17px;font-weight:600;transition:transform 90ms cubic-bezier(.2,0,.4,1)}
.primary:active{transform:scale(.98)}
.ghost{width:100%;height:44px;border-radius:12px;color:var(--t2);font-size:15px;margin-top:6px}
.err{color:var(--bad);font-size:13px;padding:4px 0;text-align:center}

#login{padding:0 16px}
#login h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:8px 0 20px}
.field{background:var(--card);border-radius:12px;padding:0 14px 10px;margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--t3);padding-top:10px}
.field input{width:100%;border:0;background:none;outline:none;height:32px;font-size:16px}

.chiprow{display:flex;align-items:center;gap:10px}
.chiprow .chips{flex:1;min-width:0}
.segtop{display:none;margin:0 16px 12px 0;width:150px;flex:none}

/* 桌面 / 程序坞独立窗口。
 *
 * 判据是 pointer:fine 而不是宽度：程序坞窗口默认只有 480 宽，按宽度判会
 * 判成手机，于是一个鼠标操作的窗口里摆着 72px 的触屏按钮和底部 Tab 条 ——
 * 那正是「看起来像被放大的手机 App」的由来。有鼠标就换密度。
 */
@media (pointer:fine){
  body{font-size:13px}
  #app{max-width:none}
  .bar,.chiprow,main,nav>*{max-width:560px;margin-left:auto;margin-right:auto;width:100%}
  .safe{padding-top:10px}
  .bar{padding-bottom:8px}
  .bar h1{font-size:17px}
  nav{display:none}                    /* Tab 上移成分段控件 */
  .segtop{display:flex}
  .chips{padding-bottom:0}
  .chiprow{padding:0 16px 12px}
  .chip{height:30px;padding:0 11px;font-size:13px;border-radius:15px}
  main{padding-bottom:20px}
  .card{border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .now-name{font-size:15px}
  .now-out{font-size:12px}
  .keys{gap:16px;margin:14px 0 4px}
  .key{width:44px;height:44px}
  .key.main{width:56px;height:56px}
  .key svg{width:19px;height:19px}
  .key.main svg{width:23px;height:23px}
  .key:hover{filter:brightness(.94)}
  input[type=range]{height:28px}
  .row{min-height:42px;padding:4px 0}
  .rowsub{font-size:12px}
  .mini{height:30px;padding:0 12px;font-size:13px;min-width:0}
  .mini:hover{filter:brightness(.94)}
  .rule{border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .rtime{font-size:17px}
  .strip{height:13px}
  .sheet{max-width:520px;border-radius:14px;bottom:auto;top:50%;left:50%;right:auto;
         transform:translate(-50%,-46%) scale(.98);opacity:0;
         transition:transform .2s ease-out,opacity .2s ease-out;
         width:min(520px,calc(100vw - 40px));max-height:84vh;
         box-shadow:0 24px 60px rgba(0,0,0,.28);padding:16px 18px 18px}
  .sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
  .grab{display:none}
  .frow{min-height:48px}
  .timeblock{width:78px;height:60px}
  .timeblock b{font-size:20px}
  .stepper button{width:36px;height:36px;font-size:17px}
  .daypick button{width:36px;height:36px}
  .daypick i{width:28px;height:28px;font-size:12px}
  .primary{height:40px;font-size:15px;border-radius:9px}
  .ghost{height:34px;font-size:14px}
  #login{max-width:400px;margin:0 auto}
  #login h2{font-size:20px}
}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:opacity .12s !important}}
</style>
</head>
<body>
<div id="app">
  <div class="safe"></div>

  <main id="login">
    <h2>声拼 · 控制台</h2>
    <div class="field"><label>服务器</label><input id="url" type="text" spellcheck="false" autocapitalize="off"></div>
    <div class="field"><label>账号</label><input id="email" type="email" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label>密码</label><input id="pass" type="password" autocomplete="current-password"></div>
    <div id="loginErr" class="err"></div>
    <button id="doLogin" class="primary" style="margin-top:10px">登录</button>
    <div class="empty">同一账号登录的所有 Mac 都会出现在这里</div>
  </main>

  <div id="shell" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="bar">
      <h1 id="title">现在</h1>
      <span class="grow"></span>
      <span id="link" class="badge">连接中</span>
      <button id="out" class="badge">退出</button>
    </div>
    <div class="chiprow">
      <div id="chips" class="chips"></div>
      <div id="segTabs" class="seg segtop">
        <button data-t="now" class="sel">现在</button><button data-t="sched">定时</button>
      </div>
    </div>

    <main id="tabNow">
      <div class="card">
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="flex:1;min-width:0">
            <div id="nowName" class="now-name">未选择</div>
            <div id="nowOut" class="now-out"></div>
          </div>
          <span id="cmdBadge" class="badge">已暂停</span>
        </div>
        <div class="track"><i id="prog"></i></div>
        <div class="times"><span id="tCur" class="num">0:00</span><span class="grow"></span><span id="tAll" class="num">0:00</span></div>
        <div id="keys" class="keys">
          <button id="bBack" class="key" aria-label="后退 15 秒">
            <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5.5 5.5 0 11-5.5 5.5H4A8 8 0 1012 5z"/></svg></button>
          <button id="bPlay" class="key main" aria-label="播放或暂停">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="bStop" class="key" aria-label="停止">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
        </div>
        <input id="vol" type="range" min="0" max="100" value="100" aria-label="音量">
      </div>

      <div class="card">
        <div class="cap" style="margin-bottom:4px">成品</div>
        <div id="items"></div>
      </div>
    </main>

    <main id="tabSched" class="hide">
      <div id="rules"></div>
      <button id="addRule" class="primary">新建定时</button>
    </main>

    <nav>
      <button id="navNow" class="sel"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>现在</button>
      <button id="navSched"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 10.6V6h-2v7.4l5.5 3.3 1-1.7-4.5-2.4z"/></svg>定时</button>
    </nav>
  </div>
</div>

<div id="scrim" class="scrim hide"></div>
<div id="sheet" class="sheet hide">
  <div class="grab"></div>
  <h2>新建定时</h2>
  <div class="seg" id="mSeg">
    <button data-m="daily" class="sel">每天</button>
    <button data-m="once">指定日期</button>
    <button data-m="window">时段内</button>
  </div>

  <div class="fcard">
    <div class="frow" id="rowDate"><span class="flabel">日期</span>
      <input id="fDate" type="date" style="font-size:16px;background:none;border:0;text-align:right"></div>
    <div class="frow"><span class="flabel" id="labStart">时间</span>
      <label class="timeblock"><b id="shStart">22:00</b><s>点按修改</s>
        <input id="fStart" type="time" value="22:00"></label></div>
    <div class="frow" id="rowEnd"><span class="flabel">结束</span>
      <label class="timeblock"><b id="shEnd">23:00</b><s>点按修改</s>
        <input id="fEnd" type="time" value="23:00"></label></div>
  </div>

  <div class="fcard" id="grpTake">
    <div class="frow"><span class="flabel">每次时长</span>
      <div class="stepper"><button data-s="play" data-d="-1">−</button><span id="vPlay" class="num">30 s</span><button data-s="play" data-d="1">＋</button></div></div>
    <div class="frow"><span class="flabel">重复次数</span>
      <div class="stepper"><button data-s="rep" data-d="-1">−</button><span id="vRep" class="num">3 次</span><button data-s="rep" data-d="1">＋</button></div></div>
    <div class="frow"><span class="flabel">间隔</span>
      <div class="stepper"><button data-s="gap" data-d="-1">−</button><span id="vGap" class="num">60 s</span><button data-s="gap" data-d="1">＋</button></div></div>
  </div>

  <div class="fcard" id="grpDays" style="padding:8px 12px">
    <div class="cap">只在这些天（不选＝每天）</div>
    <div class="daypick" id="dayPick"></div>
  </div>

  <div class="verdict" id="verdict"></div>
  <div id="sheetErr" class="err"></div>
  <button id="saveRule" class="primary">保存</button>
  <button id="cancelRule" class="ghost">取消</button>
</div>

<script>
/* 声拼控制台 —— 按设计稿 3a–3g 实现。
 *
 * 遥控器，不是播放器：音频和蓝牙音箱都在 Mac 那边，这里只写记录。
 * 单文件、零依赖、零构建，和 Mac 端同一原则。
 */
const $ = s => document.querySelector(s);
const S = {
  url: localStorage.ssUrl || 'https://baihe.yujiev.com:54812',
  token: localStorage.ssToken || '',
  players: [], items: [], scheds: [], sel: null, selItem: null,
  tab: 'now', es: null, retries: 0, cmd: 'idle', failMsg: '',
  cmdTimer: null, failTimer: null,
};
const DAYS = ['日', '一', '二', '三', '四', '五', '六'];   // 下标 = weekday-1

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`
           : `${m}:${String(x).padStart(2, '0')}`;
};

async function api(path, opts = {}) {
  const r = await fetch(S.url + path, { ...opts, headers: {
    'Content-Type': 'application/json',
    ...(S.token ? { Authorization: S.token } : {}), ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.message || `HTTP ${r.status}`);
  return body;
}

/* ---------- 东八区 ----------
 * 规则写的是墙上钟点，判定必须在 Asia/Shanghai 做，不能跟随看页面的设备：
 * 人在国外打开控制台，「每天 22:00」不该变成当地的 22:00。 */
const CN = 'Asia/Shanghai';
const cnParts = d => {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: CN, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', weekday: 'short' }).formatToParts(d);
  const g = t => p.find(x => x.type === t)?.value;
  const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(g('weekday')) + 1;
  return { date: `${g('year')}-${g('month')}-${g('day')}`,
           minutes: (+g('hour') % 24) * 60 + +g('minute'), weekday: wd };
};
const hhmm = t => { const p = String(t || '').split(':'); return p.length === 2 ? +p[0] * 60 + +p[1] : null; };

/* 「下一次什么时候响」—— 用户唯一真正要的答案，所以它是每条规则的主结论 */
function nextFire(s, now = new Date()) {
  const start = hhmm(s.startTime);
  if (start == null || !s.enabled) return null;
  const nowP = cnParts(now);

  // 一次性规则直接按日期算，不能靠逐日扫描：排在两周后的规则会扫不到，
  // 于是被判成「不会再响」——一条完全正常的规则。
  if (s.mode === 'once') {
    if (!s.date) return null;
    const days = Math.round((Date.parse(s.date + 'T00:00:00Z') -
                             Date.parse(nowP.date + 'T00:00:00Z')) / 86400000);
    if (days < 0 || (days === 0 && nowP.minutes >= start)) return { expired: true };
    return { at: start, days, live: false };
  }

  for (let d = 0; d < 8; d++) {
    const p = cnParts(new Date(now.getTime() + d * 86400000));
    if (s.weekdays && s.weekdays.length && !s.weekdays.includes(p.weekday)) continue;
    if (d === 0 && nowP.minutes >= start) {
      if (s.mode === 'window') {
        const end = hhmm(s.endTime);
        if (end != null && (end > start ? nowP.minutes < end : true)) return { at: start, days: 0, live: true };
      }
      continue;
    }
    return { at: start, days: d, live: false };
  }
  return null;
}
const clock = m => `${String((m / 60) | 0).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const sayWhen = f => !f ? '不会再响' : f.expired ? '已完成' : f.live ? '正在响'
  : f.days === 0 ? `今天 ${clock(f.at)}` : f.days === 1 ? `明天 ${clock(f.at)}`
  : `${f.days} 天后 ${clock(f.at)}`;

  }

  else if (S.cmd === 'slow') setBadge('未回应', 'bt', true);
  else if (S.cmd === 'fail') setBadge(S.failMsg || '失败 · 重试', 'bad');
  else setBadge(p.state === 'playing' ? '播放中' : '已暂停', p.state === 'playing' ? 'ok' : '');
}

/* ---------- 异步指令三态（3g） ---------- */
async function cmd(action, payload = {}) {
  if (!current()) return;
  clearTimeout(S.cmdTimer); clearTimeout(S.failTimer);
  S.cmd = 'idle';
  // 转圈只在 90 ms 后出现：多数指令 200 ms 内回报，立刻转圈反而更像卡顿。
  S.cmdTimer = setTimeout(() => { S.cmd = 'pending'; renderNow(); }, 90);
  try {
    const rec = await api('/api/collections/ss_commands/records', { method: 'POST',
      body: JSON.stringify({ player: S.sel, action, payload, status: 'pending' }) });
    watch(rec.id);
  } catch (e) { fail(String(e.message || e)); }
}

function watch(id) {
  const began = Date.now();
  const tick = async () => {
    let rec;
    try { rec = await api('/api/collections/ss_commands/records/' + id); }
    catch { return; }
    if (rec.status === 'done') { clearTimeout(S.cmdTimer); S.cmd = 'idle'; renderNow(); return; }
    if (rec.status === 'failed') return fail(rec.result || '执行失败');
    const age = Date.now() - began;
    // 心跳同时失鲜就不报指令失败——原因要指向真问题。
    if (!isLive(current())) { clearTimeout(S.cmdTimer); S.cmd = 'idle'; renderNow(); return; }
    if (age > 8000) return fail('设备未回应');
    if (age > 3000) { clearTimeout(S.cmdTimer); S.cmd = 'slow'; renderNow(); }
    setTimeout(tick, 400);
  };
  setTimeout(tick, 250);
}

function fail(msg) {
  clearTimeout(S.cmdTimer);
  S.cmd = 'fail'; S.failMsg = msg; renderNow();
  const keys = $('#keys');
  keys.classList.remove('shake'); void keys.offsetWidth; keys.classList.add('shake');
  // 失败要看得见，但不该赖着不走。
  S.failTimer = setTimeout(() => { S.cmd = 'idle'; renderNow(); }, 3000);
}

const play = it => { S.selItem = it.id; renderItems();
  cmd('play', { localPath: it.localPath, name: it.name, itemId: it.id }); };

async function loadScheds() {
  const r = await api('/api/collections/ss_schedules/records?perPage=200&sort=startTime&filter=' +
                      encodeURIComponent(`player='${S.sel}'`));
  S.scheds = r.items || []; renderRules();

function renderRules() {
  const box = $('#rules');
  if (!S.scheds.length) {
    box.innerHTML = '<div class="card"><div class="empty">还没有定时规则<br>新建一条，Mac 到点会自己响</div></div>';
    return;
  }
  const nowMin = cnParts(new Date()).minutes;
  const pct = m => (m / 14.4);            // 一天 1440 分钟 → 百分比
  box.innerHTML = '';
  for (const s of S.scheds) {
    const f = nextFire(s);
    const start = hhmm(s.startTime) ?? 0;
    const head = s.mode === 'window' ? `${s.startTime} → ${s.endTime}`
               : s.mode === 'once' ? `${(s.date || '').slice(5)} ${s.startTime}` : s.startTime;
    const kind = s.mode === 'once' ? ' class="once"' : '';

    // 24 小时缩略条：把「什么时候响」变成位置问题；跨午夜自动切两段
    let blocks = '';
    if (s.mode === 'window') {
      const end = hhmm(s.endTime) ?? start;
      blocks = end > start
        ? `<b${kind} style="left:${pct(start)}%;width:${pct(end - start)}%"></b>`
        : `<b${kind} style="left:${pct(start)}%;right:0"></b><b${kind} style="left:0;width:${pct(end)}%"></b>`;
    } else {
      const takes = Math.max(1, s.repeatCount || 1);
      const cycleMin = ((s.playSeconds || 0) + (s.gapSeconds || 0)) / 60;
      const wide = Math.max(0.5, pct((s.playSeconds || 60) / 60));
      for (let i = 0; i < takes && i < 60; i++)
        blocks += `<b${kind} style="left:${pct(start + i * cycleMin)}%;width:${wide}%"></b>`;
    }

    const badges = s.mode === 'window'
      ? '<span class="badge">持续</span>'
      : `<span class="badge">${s.playSeconds || 0} s</span><span class="badge">× ${s.repeatCount || 1}</span>`
        + (s.gapSeconds ? `<span class="badge">间隔 ${s.gapSeconds} s</span>` : '');

    const days = s.mode === 'once' ? ''
      : `<div class="days">${DAYS.map((d, i) =>
          `<i class="${!s.weekdays || !s.weekdays.length || s.weekdays.includes(i + 1) ? 'on' : ''}">${d}</i>`
        ).join('')}</div>`;

    const el = document.createElement('div');
    el.className = 'rule' + (s.enabled && !(f && f.expired) ? '' : ' dim');
    el.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div class="rtime num">${esc(head)}</div>
          <div class="rbadges">${badges}</div>
        </div>
        <span class="badge ${f && f.live ? 'ok' : ''}">${esc(s.enabled ? sayWhen(f) : '已停用')}</span>
      </div>
      <div class="strip">${blocks}<u style="left:${pct(nowMin)}%"></u></div>
      ${days}
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="mini" data-a="t">${s.enabled ? '停用' : '启用'}</button>
        <button class="mini" data-a="d">删除</button>
        <span class="grow"></span>
        <span class="cap" style="align-self:center">${esc(s.itemName || '')}</span>
      </div>`;
    el.querySelector('[data-a=t]').onclick = () =>
      api(`/api/collections/ss_schedules/records/${s.id}`,
          { method: 'PATCH', body: JSON.stringify({ enabled: !s.enabled }) }).then(loadScheds);
    el.querySelector('[data-a=d]').onclick = () =>
      api(`/api/collections/ss_schedules/records/${s.id}`, { method: 'DELETE' }).then(loadScheds);
    box.appendChild(el);
  }
}

/* ---------- 新建规则 ---------- */
const F = { mode: 'daily', play: 30, rep: 3, gap: 60, days: [] };
/* 秒数按档跳，不弹键盘也不用滑块（3e） */
const STEPS = [5, 10, 15, 30, 60, 120, 300, 600, 1800, 3600];
function stepVal(v, d) {
  if (d > 0) return STEPS.find(x => x > v) ?? STEPS[STEPS.length - 1];
  const below = STEPS.filter(x => x < v);
  return below.length ? below[below.length - 1] : STEPS[0];
}

/* ---------- 实时 ---------- */
/* EventSource 不能自定义请求头，也不需要：PocketBase 的 SSE 连接本身匿名，
 * 认证靠随后那个带 Authorization 的订阅 POST 绑定 clientId。这也是它能跨域的原因。 */
function connectRealtime() {
  if (S.es) S.es.close();
  const es = new EventSource(S.url + '/api/realtime');
  S.es = es;
  es.addEventListener('PB_CONNECT', async ev => {
    S.retries = 0;
    await api('/api/realtime', { method: 'POST', body: JSON.stringify({
      clientId: JSON.parse(ev.data).clientId,
      subscriptions: ['ss_players', 'ss_items', 'ss_schedules'] }) });
    setLink('已连接', 'ok');
  });
  es.addEventListener('ss_players', ev => {
    const { action, record } = JSON.parse(ev.data);
    const i = S.players.findIndex(p => p.id === record.id);
    if (action === 'delete') { if (i >= 0) S.players.splice(i, 1); }
    else if (i >= 0) S.players[i] = record; else S.players.push(record);
    if (!S.sel) S.sel = record.id;
    renderChips(); renderNow();
  });
  es.addEventListener('ss_items', () => { if (S.sel) loadItems(); });
  es.addEventListener('ss_schedules', () => { if (S.sel) loadScheds(); });
  es.onerror = () => setLink(`重连中 · 第 ${++S.retries} 次`, 'bt');
}
function setLink(text, kind) {
  $('#link').className = 'badge' + (kind ? ' ' + kind : '');
  $('#link').textContent = text;
}

/* 心跳 15 秒一次；中间自己刷新，免得掉线的机器一直亮着绿点，
 * 也让规则上的「下一次」和当前时刻线跟着走。 */
setInterval(() => {
  renderNow(); renderChips();
  if (S.tab === 'sched') renderRules();
}, 5000);

/* ---------- 不缩放 ---------- */
/* iOS 的捏合缩放是 WebKit 私有的 gesture 事件，viewport 的 user-scalable=no
 * 在 Safari 里早就被忽略了；只有把这三个事件按住才真的不缩放。 */
for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
  document.addEventListener(t, e => e.preventDefault(), { passive: false });

/* 双击放大：touch-action 已经挡掉大部分，但 iOS 在部分元素上仍会触发，
 * 300 ms 内的第二次点击直接吃掉。单击不受影响。 */
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });

if (S.token) start();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
