<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>声拼 · 控制台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 设计稿 3f 组件规格 —— 改样式先改这里，别在结构里写死值。 */
:root{
  --accent:#0A6CFF; --ok:#34C759; --bt:#FF9F0A; --bad:#FF3B30; --once:#AF52DE; --off:#8E8E93;
  --bg:#F2F2F7; --card:#FFF; --card2:#F7F7F8; --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.14);
  --t1:#1D1D1F; --t2:#6E6E73; --t3:#8A8A8E;
  --okText:#248A3D; --badText:#C42B21; --accText:#0A4FA3; --btText:#B4700A;
}
@media (prefers-color-scheme:dark){
  :root{--accent:#0A84FF; --ok:#30D158; --bad:#FF453A;
        --bg:#000; --card:#1C1C1E; --card2:#2C2C2E; --line:rgba(255,255,255,.10);
        --line2:rgba(255,255,255,.16); --t1:#F2F2F7; --t2:#C7C7CC; --t3:#8E8E93;
        --okText:#30D158; --badText:#FF453A; --accText:#0A84FF; --btText:#FF9F0A}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 装到桌面后要像原生 App：不缩放。
 * 双指缩放和双击放大是两套机制，得分别堵：
 *   touch-action:pan-y  —— 只允许纵向滚动，顺带干掉双击放大
 *   gesture* 事件       —— iOS 的捏合走的是 WebKit 私有事件，
 *                          光靠 viewport 的 user-scalable=no 拦不住
 * 横向滚动的设备条和滑块各自声明自己需要的方向，否则会被一起锁死。 */
html,body{margin:0;height:100%;touch-action:pan-y;-webkit-text-size-adjust:100%;
          overscroll-behavior:none}
.chips{touch-action:pan-x}
input[type=range]{touch-action:none}
/* 🔴 每加一个纵向滚动容器就要在这里补一笔，否则它自己那一层又能左右拖了：
   touch-action 不继承，`.sheet` 上的 pan-y 管不到里面新开的滚动区；而
   `overflow-y:auto` 会把 overflow-x 一起变成 auto（规范如此），于是内容
   哪怕只宽出几像素也能横着拽。两条一起写死方向。 */
main,.sheet,.sbody,.picklist{touch-action:pan-y}
/* 🔴 body 永不滚动，滚动只发生在 main 里。
 *
 * 用户报「PWA 下底部 tab 会跟着页面滚」——**不是 nav 的定位写错了**：
 * 它一直是 flex 列里的 `flex:none`，在文档流里本来就不动。动的是它上面的整个
 * body：iOS 的橡皮筋把整个外壳连同 tab 条一起拉走。所以要按住的是 body，
 * 不是给 nav 加 `position:fixed`（那样反而要重算内容区高度，还会在键盘弹出时错位）。
 * 抄 travelAA 的做法（`src/styles/globals.css`），那边把同一件事记作
 * 「网页感的头号来源」。 */
body{background:var(--bg);color:var(--t1);
  font:14px/1.5 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  position:fixed;inset:0;overflow:hidden}
.mono,.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.hide{display:none !important}
.grow{flex:1}

/* body 已经钉死在视口上（见上），所以这里跟着它取 100% 就够，不必再算一次
   dvh —— 键盘弹出时 dvh 会变，而固定的 body 不会。 */
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}
.safe{padding-top:max(env(safe-area-inset-top),12px)}
.bar{padding:0 16px 10px;display:flex;align-items:center;gap:8px}
.bar h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}

/* 设备 chip 条常驻：换机一步，视线不动（3a） */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:18px;display:flex;align-items:center;
      gap:7px;background:var(--card);border:.5px solid var(--line2);font-size:14px;font-weight:500;
      white-space:nowrap;transition:background .18s ease-out,color .18s ease-out}
.chip.sel{background:var(--accent);border-color:transparent;color:#fff}
.chip.off{color:var(--off)}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
/* 命中区补到 30px：铅笔本身只有十来像素，够看不够点 */
.cpen{margin:-8px -6px -8px 2px;padding:8px 6px;font-size:13px;opacity:.75;line-height:1}
.chip.off .cdot{background:#C7C7CC}
/* 连接中：醒着但指令通道还没建起来。橙色，和「在线绿 / 离线灰」都分得开 */
.chip.wake .cdot{background:var(--bt)}
.chip.sel.wake .cdot{background:#FFD60A}
/* 🔴 圆点只说明「在不在线」，选中与否由胶囊底色说。以前选中时把绿点刷成白色，
   等于用「选中」把「在线」这条信息覆盖掉——看起来正好像掉线了。绿色留着，
   加一圈白边解决绿点压在蓝底上的分离度问题。 */
.chip.sel .cdot{box-shadow:0 0 0 1.5px rgba(255,255,255,.95)}
/* 选中 + 离线：灰字压在蓝底上既看不清又是同一个错误，改用淡一档的白 */
.chip.sel.off{color:rgba(255,255,255,.62)}
.chip.sel.off .cdot{background:rgba(255,255,255,.45)}

main{flex:1;overflow:hidden auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.cap{font-size:11px;font-weight:600;color:var(--t3)}

/* 状态一律靠徽标表达，不写句子 */
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--line);
       color:var(--t2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
       transition:background .14s,color .14s}
.badge.ok{background:rgba(52,199,89,.16);color:var(--okText)}
.badge.bt{background:rgba(255,159,10,.18);color:var(--btText)}
.badge.bad{background:rgba(255,59,48,.12);color:var(--badText)}
.badge.acc{background:rgba(10,108,255,.14);color:var(--accText)}

.now-name{font-size:17px;font-weight:600}
.now-out{font-size:13px;color:var(--t2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.track{height:4px;border-radius:2px;background:var(--line);margin:14px 0 6px;overflow:hidden}
/* 过渡时长和 1 秒的重绘节拍对齐，进度条才是连续走的而不是一秒一跳 */
.track>i{display:block;height:100%;background:var(--accent);width:0;transition:width 1s linear}
.times{display:flex;font-size:12px;color:var(--t3)}
.keys{display:flex;align-items:center;justify-content:center;gap:22px;margin:16px 0 6px}
.key{width:56px;height:56px;border-radius:50%;background:var(--card2);display:flex;
     align-items:center;justify-content:center;transition:transform 90ms cubic-bezier(.2,0,.4,1)}
.key.main{width:72px;height:72px;background:var(--accent)}
.key:active{transform:scale(.92)}
.key svg{width:24px;height:24px;fill:var(--t1)}
.key.main svg{width:30px;height:30px;fill:#fff}
.shake{animation:shake 260ms ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
                 50%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.spin{animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=range]{width:100%;accent-color:var(--accent);height:44px}
/* 音量条旁边一枚徽标，回答「拖它会不会真的改这台机器的音量」——
   一句说明会比滑块本身还长，所以这里只放两三个字，原因进 title。 */
.volrow{display:flex;align-items:center;gap:8px}
.volrow input[type=range]{flex:1;min-width:0}
.volrow .badge{flex:none}
/* 可点的输出设备：底下一条虚线，说明这行不只是读数 */
.now-out .tapdev{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}

.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0}
.row+.row{border-top:.5px solid var(--line)}
.rowmain{flex:1;min-width:0}
/* 名字多长都只占一行：列表行高一变，整页就开始跳。全名在 ⋯ 弹窗里看得到。 */
.rowmain>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowsub{font-size:13px;color:var(--t2);margin-top:2px}
.empty{text-align:center;padding:28px 8px;color:var(--t3);font-size:13px;line-height:1.7}
.mini{height:40px;min-width:44px;padding:0 14px;border-radius:9px;background:var(--card2);
      font-size:14px;font-weight:500}
.mini.acc{background:var(--accent);color:#fff}
.mini.more{padding:0 10px;min-width:38px;color:var(--t2);font-size:17px;line-height:1}
.mini.play{padding:0 11px;min-width:40px;font-size:13px}
/* 成品/共享切换：两段小控件，和 .cap 同一行。选中只用底色说，不用颜色喊。 */
.caprow{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--card2);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--t2);font:inherit;font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mini.danger{background:none;color:var(--bad);width:100%;height:48px;font-size:15px}
/* 二次确认不另开一层弹窗：按钮自己变成「确认移除」，一行说清代价 */
.mini.danger.armed{background:var(--bad);color:#fff}
.sheetname{font-size:13px;color:var(--t2);margin:-8px 0 12px;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
.tinput{width:100%;height:48px;border-radius:12px;background:var(--card2);border:0;
        padding:0 14px;font-size:16px;color:var(--t1);margin-bottom:10px}
/* 选播放内容：多选按点选顺序连着放，所以序号本身就是信息 */
.picklist{max-height:190px;overflow:hidden auto;-webkit-overflow-scrolling:touch}
.pick{display:flex;align-items:center;gap:10px;min-height:46px;width:100%;text-align:left}
.pick+.pick{border-top:.5px solid var(--line)}
.pick .ord{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);
           color:var(--t3);font-size:11px;font-weight:700;display:flex;
           align-items:center;justify-content:center}
.pick.on .ord{background:var(--accent);color:#fff}
.pick .pname{flex:1;min-width:0;font-size:15px;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
.pick.on .pname{color:var(--accent);font-weight:500}
.pick .plen{flex:none;font-size:12px;color:var(--t3)}

/* 定时规则：时间当主角，24 小时条把「什么时候」变成位置问题（3e） */
.rule{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.rule.dim{opacity:.55}
.rtime{font-size:19px;font-weight:700;letter-spacing:-.01em}
.rbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.strip{position:relative;height:16px;border-radius:4px;background:var(--line);margin-top:12px;overflow:hidden}
.strip>b{position:absolute;top:2px;bottom:2px;background:var(--accent);border-radius:2px;min-width:2px}
.strip>b.once{background:var(--once)}
.strip>u{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.days{display:flex;gap:5px;margin-top:10px}
.days i{width:19px;height:19px;border-radius:50%;background:var(--line);font-style:normal;
        font-size:10px;font-weight:600;color:var(--t3);display:flex;align-items:center;justify-content:center}
.days i.on{background:var(--accent);color:#fff}
/* 执行历史：徽章说的是「下次 / 正在」，这一行说「上次到底响没响」。
   两个方向各一行，点开才展开明细——平时不许占第二行。 */
.hist{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:10px;
      border-top:.5px solid var(--line);font-size:12px;color:var(--t3);cursor:pointer}
.hist b{font-weight:600}
.hist .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--t3)}
.hist.ok .dot{background:var(--ok)}
.hist.bad .dot{background:var(--bad)}
.hist .grow{flex:1}
.hist .chev{flex:none;font-size:10px;opacity:.6}
.runs{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.runs div{display:flex;gap:8px;font-size:11.5px;color:var(--t3);align-items:baseline}
.runs .num{flex:none;width:74px;color:var(--t2);font-weight:600}
.runs .what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runs .bad{color:var(--badText)}

/* 日志页：一天一张卡、一次执行一行——「几点放了什么、响了几次」的查账入口。
   行上只有一行结论；是哪条规则、失败原因这类解释进 title。 */
.lday{display:flex;font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px}
.lrow{display:flex;align-items:baseline;gap:10px;padding:8px 0;font-size:13.5px}
.lrow+.lrow{border-top:.5px solid var(--line)}
.ltime{flex:none;width:42px;color:var(--t2);font-weight:600}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lres{flex:none;font-size:12px;color:var(--t3)}
.lres.ok{color:var(--okText)}
.lres.bad{color:var(--badText)}
.lres.acc{color:var(--accText)}
/* 规则筛选条复用设备胶囊的样子；main 自带左右 16px，别再叠一层 */
#logRules{padding:0 0 12px}

/* Tab 条钉在底部，桌面也一样——只是密度收一档。
   以前桌面把它搬到顶部当分段控件，于是同一个切换器在两种环境里长在两个地方，
   而这是全局导航，位置本身就是记忆点。 */
nav{flex:none;display:flex;border-top:.5px solid var(--line);background:var(--card);
    padding-bottom:max(env(safe-area-inset-bottom),20px)}
nav button{flex:1;height:63px;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:3px;color:var(--t3);font-size:10px;font-weight:600}
nav button.sel{color:var(--accent)}
nav svg{width:22px;height:22px;fill:currentColor}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;opacity:0;transition:opacity .32s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);
       border-radius:26px 26px 0 0;padding:8px 16px max(env(safe-area-inset-bottom),20px);
       max-width:480px;margin:0 auto;max-height:90dvh;overflow:hidden auto;
       transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.show{transform:translateY(0)}
/* 长表单：抓手+标题 和 结论+按钮 钉住，中间那段自己滚。整张卡一起滚的话，
   往下看几眼就既不知道这是哪个弹窗，也找不到保存在哪儿。 */
.sheet.tall{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.sbody{flex:1;min-height:0;overflow:hidden auto;overscroll-behavior:contain;
       -webkit-overflow-scrolling:touch}
.sfoot{flex:none;padding-top:10px;padding-bottom:max(env(safe-area-inset-bottom),20px);
       border-top:.5px solid var(--line)}
.sfoot .verdict{padding:0 0 10px}
.sfoot .err{padding:0 0 8px}
/* 标题下的那条线只在真的滚动之后出现——没滚的时候它什么也不说明。
   用 ::after 而不是 border，免得线一出现整块内容往下跳一格。 */
.sheet.tall h2{position:relative}
.sheet.tall h2::after{content:'';position:absolute;left:-24px;right:-24px;bottom:-7px;
                      height:.5px;background:var(--line);opacity:0;transition:opacity .15s}
.sheet.tall.scrolled h2::after{opacity:1}
/* 取消和保存并排：主次靠宽度和填充说，不靠上下位置。 */
.btnrow{display:flex;gap:10px}
.btnrow .ghost{flex:1;margin-top:0;height:52px;background:var(--card2);font-weight:500}
.btnrow .primary{flex:1.8}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h2{font-size:17px;font-weight:600;margin:0 0 14px}
.seg{display:flex;background:var(--card2);border-radius:9px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:36px;border-radius:7px;font-size:13px;font-weight:500;color:var(--t2)}
.seg button.sel{background:var(--card);color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fcard{background:var(--card);border-radius:12px;padding:0 14px;margin-bottom:12px}
.frow{display:flex;align-items:center;min-height:60px;gap:12px}
.frow+.frow{border-top:.5px solid var(--line)}
.flabel{font-size:15px;font-weight:500;flex:1}
.timeblock{position:relative;width:88px;height:76px;border-radius:12px;background:var(--card2);
           display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.timeblock b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.timeblock s{font-size:10px;color:var(--t3);text-decoration:none}
.timeblock input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:44px;height:44px;border-radius:9px;background:var(--card2);
                font-size:20px;font-weight:400}
.stepper span{min-width:64px;text-align:center;font-size:17px;font-weight:600}
.daypick{display:flex;gap:2px;padding:8px 0 12px}
.daypick button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.daypick i{width:32px;height:32px;border-radius:50%;background:var(--card2);font-style:normal;
           font-size:13px;font-weight:600;color:var(--t2);display:flex;align-items:center;justify-content:center}
.daypick button.on i{background:var(--accent);color:#fff}
.verdict{font-size:14px;color:var(--t2);text-align:center;padding:2px 0 14px;line-height:1.6}
.verdict b{color:var(--t1);font-weight:600}
.primary{width:100%;height:52px;border-radius:12px;background:var(--accent);color:#fff;
         font-size:17px;font-weight:600;transition:transform 90ms cubic-bezier(.2,0,.4,1)}
.primary:active{transform:scale(.98)}
.ghost{width:100%;height:44px;border-radius:12px;color:var(--t2);font-size:15px;margin-top:6px}
.err{color:var(--bad);font-size:13px;padding:4px 0;text-align:center}
/* 版本落后不是故障，是「这台还差点东西」。红色留给真的失败。 */
.err.soft{color:var(--bt)}

#login{padding:0 16px}
#login h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:8px 0 20px}
.field{background:var(--card);border-radius:12px;padding:0 14px 10px;margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--t3);padding-top:10px}
.field input{width:100%;border:0;background:none;outline:none;height:32px;font-size:16px}

.chiprow{display:flex;align-items:center;gap:10px}
.chiprow .chips{flex:1;min-width:0}

/* 桌面 / 程序坞独立窗口。
 *
 * 判据是 pointer:fine 而不是宽度：程序坞窗口默认只有 480 宽，按宽度判会
 * 判成手机，于是一个鼠标操作的窗口里摆着 72px 的触屏按钮 ——
 * 那正是「看起来像被放大的手机 App」的由来。有鼠标就换密度。
 *

<script>
/* 声拼控制台 —— 按设计稿 3a–3g 实现。
 *
 * 遥控器，不是播放器：音频和蓝牙音箱都在 Mac 那边，这里只写记录。
 * 单文件、零依赖、零构建，和 Mac 端同一原则。
 */
const $ = s => document.querySelector(s);
const S = {
  url: localStorage.ssUrl || 'https://baihe.yujiev.com:54812',
  token: localStorage.ssToken || '',
  players: [], items: [], scheds: [], runs: [], openHist: null, sel: null, selItem: null,
  logRule: '',
  tab: 'now', es: null, retries: 0, cmd: 'idle', failMsg: '', doneMsg: '', doneTimer: null,
  cmdTimer: null, failTimer: null, watch: null, watchTimer: null,
  manageItem: null, armTimer: null,
  itemTab: 'local', shared: [], manageShared: null, armTimer2: null, audio: null, auditioning: null,
  auditionErr: '', auditionErrID: null, auditionTimer: null,
  pos: null, volHeld: false, devTarget: null,
};
const DAYS = ['日', '一', '二', '三', '四', '五', '六'];   // 下标 = weekday-1

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* 🔴 不用 bytes/1048576：不到 1MB 全都读成 0（或 0.0）MB，
 * 354 KB 的素材不是零，一列全是 0 MB 的行等于什么也没说。 */
const size = n => {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
};
const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = (s / 3600) | 0, m = ((s % 3600) / 60) | 0, x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`
           : `${m}:${String(x).padStart(2, '0')}`;
};

async function api(path, opts = {}) {
  const r = await fetch(S.url + path, { ...opts, headers: {
    'Content-Type': 'application/json',
    ...(S.token ? { Authorization: S.token } : {}), ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.message || `HTTP ${r.status}`);
  return body;
}

/* ---------- 东八区 ----------
 * 规则写的是墙上钟点，判定必须在 Asia/Shanghai 做，不能跟随看页面的设备：
 * 人在国外打开控制台，「每天 22:00」不该变成当地的 22:00。 */
const CN = 'Asia/Shanghai';
const cnParts = d => {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: CN, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', weekday: 'short' }).formatToParts(d);
  const g = t => p.find(x => x.type === t)?.value;
  const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(g('weekday')) + 1;
  return { date: `${g('year')}-${g('month')}-${g('day')}`,
           minutes: (+g('hour') % 24) * 60 + +g('minute'), weekday: wd };
};
const hhmm = t => { const p = String(t || '').split(':'); return p.length === 2 ? +p[0] * 60 + +p[1] : null; };

/* 今天还没到的下一次，返回当天第几分钟；今天已经放完了返回 null。
 *
 * 🔴 以前「今天过了起始时间就直接跳到明天」——一条每小时响一次的规则，
 * 10 点看它会说「明天 08:00」，而它 11 点就要响。重复次数一多这就全错。 */
function nextSlotToday(s, now) {
  const sl = takeSlots(s, now);
  if (!sl) return null;
  const midnight = Date.parse(cnParts(now).date + 'T00:00:00+08:00');
  const t = (now.getTime() - sl.anchor) / 1000;
  for (const begin of sl.at) {
    if (begin > t) return Math.round((sl.anchor + begin * 1000 - midnight) / 60000);
  }
  return null;
}

/* 未来某一天的第一次。波动的种子里有日期，所以要按那天算，不是按今天。
 *
 * 🔴 取那天自己的 takeSlots[0]，不是「起始时刻 + wander」——时段模式的第一次
 * 同样会被波动推开（而且还要 clamp 回时段内），以前这里对 window 直接返回裸
 * 起始时刻，于是网页说「明天 01:00」而 Mac 端 01:04 才响。同一份落点算两遍
 * 就是这么分家的：liveTake 和 nextSlotToday 早就走 takeSlots 了，只有它没走。 */
function firstSlotOn(s, day) {
  const start = hhmm(s.startTime);
  if (start == null) return start;
  const midnight = Date.parse(day + 'T00:00:00+08:00');
  const sl = takeSlots(s, new Date(midnight + 43200000));   // 那天正午，落在同一天里
  if (!sl || !sl.at.length) return start;
  return Math.round((sl.anchor + sl.at[0] * 1000 - midnight) / 60000);
}

/* 「下一次什么时候响」—— 用户唯一真正要的答案，所以它是每条规则的主结论 */
function nextFire(s, now = new Date()) {
  const start = hhmm(s.startTime);
  if (start == null || !s.enabled) return null;
  const nowP = cnParts(now);

  // 一次性规则直接按日期算，不能靠逐日扫描：排在两周后的规则会扫不到，
  // 于是被判成「不会再响」——一条完全正常的规则。
  if (s.mode === 'once') {
    if (!s.date) return null;
    const days = Math.round((Date.parse(s.date + 'T00:00:00Z') -
                             Date.parse(nowP.date + 'T00:00:00Z')) / 86400000);
    if (days < 0) return { expired: true };
    if (days === 0) {
      if (liveTake(s, now)) return { at: nowP.minutes, days: 0, live: true };
      const nx = nextSlotToday(s, now);
      return nx == null ? { expired: true } : { at: nx, days: 0, live: false };
    }
    return { at: firstSlotOn(s, s.date), days, live: false };
  }

  for (let d = 0; d < 8; d++) {
    const p = cnParts(new Date(now.getTime() + d * 86400000));
    if (s.weekdays && s.weekdays.length && !s.weekdays.includes(p.weekday)) continue;
    if (d === 0) {
      if (liveTake(s, now)) return { at: start, days: 0, live: true };
      const nx = nextSlotToday(s, now);
      if (nx != null) return { at: nx, days: 0, live: false };
      continue;                                  // 今天的都放完了，看明天
    }
    return { at: firstSlotOn(s, p.date), days: d, live: false };
  }
  return null;
}
/* 两端版本不齐时不要撒谎。
 * 旧版 Mac 根本不上报 audible，而 PocketBase 的布尔字段默认存 false ——
 * 照着渲染就会给一台正在正常播放的机器打上「无声」。分不清「上报了 false」
 * 和「压根没上报」时，就退回到旧的说法，别编。 */
const atLeast = (v, min) => {
  const a = String(v || '0').split('.').map(Number), b = min.split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); }
  return true;
};
const reportsAudio = p => atLeast(p.appVersion, '0.11.0');
// 出声次数是 0.17.0 才有的；老版本没有这个字段，会一直显示「等待出声」。
const reportsCount = p => atLeast(p.appVersion, '0.17.0');
// 改名/移除要 Mac 端配合改本机清单，老版本会回「不认识的指令」——那就别给按钮。
const canManage = p => p && atLeast(p.appVersion, '0.13.0');
// 执行日志是 0.18.0 才写的。老版本一行都不会有，照着渲染就会把每条定时规则
// 都判成「到点了没在播」——一台工作正常的机器，满屏红字。
const reportsRuns = p => p && atLeast(p.appVersion, '0.18.0');
// 「停这一次」靠 Mac 认得 pausedTake。老版本会照播不误，给了按钮等于给个假开关。
const canPause = p => p && atLeast(p.appVersion, '0.21.0');
// 播完后再按播放，Mac 自己会先回到开头——0.22.0 才有。老版本见 #bPlay。
const rewindsAtEnd = p => p && atLeast(p.appVersion, '0.22.0');
// 时段内按「每隔 N 播一次」分次播是 0.23.0 才有的：老版本收到同一条规则会
// 整段循环到结束时间——比设定的吵得多。所以老机器上这几栏干脆不给。
const splitsWindow = p => p && atLeast(p.appVersion, '0.23.0');
// 「接着上次往下」是 0.24.0 才有的：老版本每次都从头播，开关在它们身上是假的。
const canContinue = p => p && atLeast(p.appVersion, '0.24.0');
// 切输出设备 + 推系统音量都是 0.27.0 才有的。老版本收到 output 会回
// 「不认识的指令」，而它的音量滑块推的仍然只是声拼自己的增益——
// 所以设备那行不给点，音量徽标照实说「仅声拼」。
const canRoute = p => p && atLeast(p.appVersion, '0.27.0');
// 上传到共享 / 下到这台机器都要 Mac 端执行（文件在它上面，网页手里没有字节）。
// 0.29.0 之前收到 share/pull 会回「不认识的指令」，所以老机器上这两个按钮不给。
const canShare = p => p && atLeast(p.appVersion, '0.29.0');
// 抓链接由被控端自己下载（音频要落在它的盘上），老版本收到 fetch 会回「不认识的指令」。
const canFetch = p => p && atLeast(p.appVersion, '0.30.0');

/* 哪些功能要哪个版本 —— 新到旧。设备弹窗用它回答「这台差在哪」。
 * 🔴 加了新的版本卡点就往这里补一条，否则设备弹窗会说「一切正常」，
 * 而按钮那边照样是灰的，两处对不上比不说更糟。 */
const FEATURES = [
  { min: '0.30.0', name: '下载音频' },
  { min: '0.29.0', name: '共享音频库' },
  { min: '0.27.0', name: '切输出设备 / 机器音量' },
  { min: '0.24.0', name: '接着上次往下播' },
  { min: '0.23.0', name: '时段内分次播' },
  { min: '0.22.0', name: '播完再按播放' },
  { min: '0.21.0', name: '停这一次' },
  { min: '0.18.0', name: '定时执行日志' },
  { min: '0.13.0', name: '成品改名 / 移除' },
];
const missingFeatures = p => FEATURES.filter(f => !atLeast(p && p.appVersion, f.min));

/* 五格电平条：数字读不出「大概多响」，格子可以 */
const meter = lv => {
  const n = Math.max(0, Math.min(5, Math.round((lv || 0) * 7)));
  return '▁▃▅▆█'.slice(0, n).padEnd(0) || '▁';
};

const clock = m => `${String((m / 60) | 0).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const sayWhen = f => !f ? '不会再响' : f.expired ? '已完成' : f.live ? '正在响'
  : f.days === 0 ? `今天 ${clock(f.at)}` : f.days === 1 ? `明天 ${clock(f.at)}`
  : `${f.days} 天后 ${clock(f.at)}`;

/* PocketBase 发的是 "2026-08-02 10:11:12.345Z"，空格不是所有引擎都当 ISO 认 */
const pbDate = v => new Date(String(v || '').replace(' ', 'T'));
/* 东八区的钟点；不是今天就带上日期，否则「08:00」看不出是哪天的 08:00 */
const cnTime = v => {
  const d = pbDate(v);
  if (isNaN(+d)) return '';
  const p = cnParts(d);
  return p.date === cnParts(new Date()).date ? clock(p.minutes)
                                             : `${p.date.slice(5)} ${clock(p.minutes)}`;
};

/* 「此刻是不是正在这条规则的执行窗内」——和 Mac 端 PlaybackSchedule.take(at:) 同一套算术。
 *
 * nextFire 只回答「下一次什么时候」，而 daily 规则正在响的那半小时里它照样报明天：
 * 于是规则卡在真正执行的时候反而什么状态都不说。两边各算一次是重复，但把它挪到
 * 服务端就等于让「现在响不响」依赖一次网络往返——Mac 才是权威，这里是它的镜子。 */
/* 这一次什么时候停：本身放满，或者时段到点——以先到的为准。 */
const stopAt = (sl, begin) => Math.min(begin + sl.length, sl.until ?? Infinity);

function liveTake(s, now = new Date()) {
  const slots = takeSlots(s, now);
  if (!slots) return null;
  const t = (now.getTime() - slots.anchor) / 1000;
  for (let i = 0; i < slots.at.length; i++) {
    const begin = slots.at[i];
    if (t >= begin && t < stopAt(slots, begin)) return { elapsed: t - begin, take: i };
  }
  return null;
}


/* 此刻名义上该响的那一次的起点，epoch 秒；不在窗内返回 null。
 *
 * 🔴 故意**不看** pausedTake：控制端必须分得清「没在播」和「被叫停了」——
 * 前者是故障要报红，后者是用户自己按的，报红就是在骂人。 */
function currentTakeAt(s, now = new Date()) {
  const sl = takeSlots(s, now);
  if (!sl) return null;
  const t = (now.getTime() - sl.anchor) / 1000;
  for (const begin of sl.at) {
    if (t >= begin && t < stopAt(sl, begin)) return Math.round((sl.anchor + begin * 1000) / 1000);
  }
  return null;
}

/* 此刻这一次是不是被叫停了。秒级比较：波动是浮点，两端各自算出来的落点小数位
   未必相同，而两次真实执行之间至少隔一个周期，一秒的余量撞不上。 */
function isPausedNow(s, now = new Date()) {
  const at = currentTakeAt(s, now);
  return at != null && (s.pausedTake > 0) && Math.abs(s.pausedTake - at) < 1;
}

/* 每一次的起点（相对当天锚点的秒数）。liveTake 和「下次什么时候」都从这里来，
   算一次就不会出现「徽章说在播、下一次却算成明天」这种自相矛盾。 */
function takeSlots(s, now = new Date()) {
  if (!s.enabled || !s.localPath) return null;
  const start = hhmm(s.startTime);
  if (start == null) return null;
  const p = cnParts(now);
  if (s.mode === 'once') { if (s.date !== p.date) return null; }
  else if (s.weekdays && s.weekdays.length && !s.weekdays.includes(p.weekday)) return null;
  // 东八区没有夏令时，偏移是常数，所以锚点可以直接算出来
  const anchor = Date.parse(p.date + 'T00:00:00+08:00') + start * 60000;

  const length = s.playSeconds > 0 ? s.playSeconds : 0;
  const cycle = length + Math.max(0, s.gapSeconds || 0);

  if (s.mode === 'window') {
    const end = hhmm(s.endTime);
    // 跨午夜的窗口 Mac 端就不支持（要求 end > start），这里跟着它，别自作主张
    if (end == null || end <= start) return null;
    const span = (end - start) * 60;
    // 不设每次时长 = 老行为：整段循环到结束时间
    if (!length) return { anchor, day: p.date, length: span, at: [0], until: span };
    // 设了就是「时段内每隔 N 播一次」：和 daily 同一套排布，次数由时段长度定，
    // 只多一条——波动不许把一次推出它自己的时段（Mac 端同样 clamp，见 take(at:)）。
    const slots = Math.min(20000, Math.max(1, Math.floor((span - length) / cycle) + 1));
    const at = [];
    const last = Math.max(0, span - length);
    for (let i = 0; i < slots; i++)
      at.push(Math.min(Math.max(i * cycle + wander(s, i, p.date), 0), last));
    // 时段结束就是硬上界：一次没播完也到此为止（Mac 端那条 `now < end` 守卫）。
    // 时段比一次还短时，两端全靠它才对得上。
    return { anchor, day: p.date, length, at, until: span };
  }
  const takes = Math.max(1, s.repeatCount || 1);
  if (!length) return { anchor, day: p.date, length: 3600, at: [0] };  // 不限长：放完为止
  const at = [];
  for (let i = 0; i < takes; i++) at.push(i * cycle + wander(s, i, p.date));
  return { anchor, day: p.date, length, at };
}

/* 「今天之前这条规则已经跑过几天」——Mac 端 runDays 的孪生，逐日走同一套判断。
   规则不执行的星期不算：一条周一三五的规则活了一个月，是跑了十来次，不是三十次，
   按日历天算会把录音里五分之四的内容跳过去。 */
function runDays(s, now = new Date()) {
  if (!s.continuous || !s.created) return 0;
  const from = cnParts(pbDate(s.created)).date;
  const today = cnParts(now).date;
  let n = 0, t = Date.parse(from + 'T12:00:00+08:00');   // 正午做代表，东八区没有夏令时
  for (let i = 0; i < 3650; i++) {
    const p = cnParts(new Date(t));
    if (p.date >= today) break;
    if (!s.weekdays || !s.weekdays.length || s.weekdays.includes(p.weekday)) n++;
    t += 86400000;
  }
  return n;
}

/* 第 index 次开始前，这条规则已经播掉多少秒。Mac 端 consumed(takeIndex:…) 的孪生。 */
function consumedAt(s, index, now = new Date()) {
  const length = s.playSeconds > 0 ? s.playSeconds : 0;
  if (!s.continuous || !length) return 0;
  const sl = takeSlots({ ...s, enabled: true, weekdays: [], localPath: s.localPath || '/x' }, now);
  const perDay = Math.max(1, s.mode === 'window' ? (sl ? sl.at.length : 1) : (s.repeatCount || 1));
  return (runDays(s, now) * perDay + index) * length;
}

/* ss_schedules 上有没有 continuous 字段。PocketBase 返回记录时会带上 schema 里的
   每一个字段，所以有一条规则就看得出来；一条都没有时先当它有（新建保存一次之后
   就知道了）。 */
const contFieldReady = () => !S.scheds.length || S.scheds.some(x => 'continuous' in x);

/* 时段内会响几次。取自 takeSlots 本身，不另算一遍——「结论行说 6 次、实际响 5 次」
   这种事只会在两处各算一遍时发生。 */
function windowRounds(s) {
  // 星期清空：今天是不是它该响的日子，和「响起来是几次」没关系，
  // 而带着星期算会在非执行日返回 0，让结论行说「约 0 次」。
  const sl = takeSlots({ ...s, enabled: true, weekdays: [], localPath: s.localPath || '/x' });
  return sl ? sl.at.length : 0;
}

/* 🔴 和 Mac 端 PlaybackSchedule.wander 必须逐位一致，否则控制端说 08:03、
 * Mac 08:07 才响，而两边各自都"对"。差异只会在真到点那一刻暴露。
 *
 * FNV-1a + 末尾雪崩，走 UTF-8 字节。种子是 PocketBase id + 日期 + 整数，
 * 全 ASCII，所以这里按码元取和 Swift 按字节取结果相同——喂进非 ASCII 就会
 * 悄悄分家。乘法必须走 Math.imul：普通 * 超过 2^53 就丢精度，和 Swift 的
 * &* 环绕语义对不上。 */
function wander(s, index, day) {
  const spread = Math.max(0, s.jitterSeconds || 0);
  if (!(spread > 0)) return 0;
  const seed = `${s.id}|${day}#${index}`;
  let h = 2166136261 >>> 0;
  for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619) >>> 0;
  h = (h ^ (h >>> 15)) >>> 0; h = Math.imul(h, 2246822519) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0; h = Math.imul(h, 3266489917) >>> 0;
  h = (h ^ (h >>> 16)) >>> 0;
  return (h / 4294967295 * 2 - 1) * spread;
}

/* ---------- 登录 ---------- */
$('#url').value = S.url;
$('#email').value = localStorage.ssEmail || '';
$('#doLogin').onclick = async () => {
  $('#loginErr').textContent = '';
  S.url = $('#url').value.replace(/\/+$/, '');
  try {
    const r = await api('/api/collections/ss_users/auth-with-password', { method: 'POST',
      body: JSON.stringify({ identity: $('#email').value, password: $('#pass').value }) });
    S.token = r.token;
    localStorage.ssUrl = S.url; localStorage.ssToken = S.token;
    localStorage.ssEmail = $('#email').value;
    start();
  } catch (e) { $('#loginErr').textContent = String(e.message || e); }
};
$('#out').onclick = () => {
  // 退出等于换人：记住的那台机器也不该留给下一个账号。
  localStorage.removeItem('ssToken'); localStorage.removeItem('ssSel'); location.reload();
};

/* ---------- 启动 ---------- */
async function start() {
  $('#login').classList.add('hide');
  $('#shell').classList.remove('hide');
  try { await loadPlayers(); connectRealtime(); loadShared().catch(() => {}); }
  catch (e) {
    if (/40[13]/.test(String(e.message))) { localStorage.removeItem('ssToken'); location.reload(); }
    $('#loginErr').textContent = String(e.message || e);
  }
}

async function loadPlayers() {
  // 🔴 别按 updated 排：那是**心跳时间**，每 5–15 秒动一次，于是设备胶囊的顺序
  // 一直在自己换位置——正要点的那一枚会在手指底下跑掉。设备是长期存在的东西，
  // 顺序就该是固定的，按显示名排（Mac 端那份也是这么排的，两边看到同一个顺序）。
  const r = await api('/api/collections/ss_players/records?perPage=50&sort=created');
  S.players = (r.items || []).sort((a, b) =>
    deviceName(a).localeCompare(deviceName(b), 'zh-Hans-CN', { numeric: true })
    || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  // 记住上次选的那台：两台机器时「列表第一台」有一半概率不是想控的那台，
  // 而这不值得做成一个偏好设置——直接记住就行。存的 id 可能已经不在了
  // （换了账号、机器被删），所以永远要在现有列表里核对一次再用。
  if (!S.sel && S.players.some(p => p.id === localStorage.ssSel)) S.sel = localStorage.ssSel;
  if (!S.sel && S.players.length) S.sel = S.players[0].id;
  notePos(current());
  renderChips(); renderNow();
  if (S.sel) { await loadItems(); await loadScheds(); }
}

/* 心跳新鲜度才是「在线」的依据：掉线的机器不会有人来改 online 字段。
   而 `online` 自 0.26.5 起只在**订阅成功后**才为真——它说的是「指令进得来」，
   不是「进程活着」。两个条件都要。 */
const isLive = p => !!p && p.online && (Date.now() - new Date(p.lastSeen || 0).getTime() < 60000);
/* 心跳很新、但指令通道还没建起来：冷启动和睡醒后的那几秒就是这个状态。
   🔴 以前这里和「离线」混作一谈，于是屏幕上写着「离线 · 心跳 0 分前」——自相矛盾，
   而真正该说的是「再等一下」。老版本 Mac（<0.26.5）永远 online=true，不会走到这条。 */
const isWaking = p => !!p && !p.online && (Date.now() - new Date(p.lastSeen || 0).getTime() < 60000);
const current = () => S.players.find(p => p.id === S.sel);
// 停在结尾 ≠ 暂停：进度条满格却写着「已暂停」，按下播放又什么都不发生（见 #bPlay）。
// 半秒余量——AAC 最后一帧不会正好落在报上来的时长上。
const ended = p => !!p && p.state === 'paused' && (p.duration || 0) > 0
  && (p.position || 0) >= p.duration - 0.5;
// 机器名是 macOS 报上来的，通常又长又带「XXX 的」；截短只是为了塞进胶囊。
const shortName = n => (String(n || 'Mac').replace(/^虞杰的\s*/, '').split(/\s+/)[0] || 'Mac');
// 用户自己起的名字原样显示——截断是给机器名做的补救，不该用在人写的字上。
const deviceName = p => (p && p.label) ? p.label : shortName(p && p.name);

function renderChips() {
  const box = $('#chips');
  box.innerHTML = '';
  for (const p of S.players) {
    const b = document.createElement('button');
    // 连接中单独一档：灰点说「不在」，而它其实在，只是还收不了指令
    b.className = 'chip' + (p.id === S.sel ? ' sel' : '')
      + (isLive(p) ? '' : isWaking(p) ? ' wake' : ' off');
    // 改名的入口只长在选中的那一枚上：每一枚都挂个铅笔会把设备切换这件事
    // 淹掉，而改名总是先选中再改。
    b.innerHTML = `<span class="cdot"></span>${esc(deviceName(p))}`
      + (p.id === S.sel ? '<span class="cpen" role="button" aria-label="改名">✎</span>' : '');
    b.onclick = async e => {
      if (e.target.classList.contains('cpen')) { openDevSheet(p); return; }
      S.sel = p.id; S.selItem = null; S.cmd = 'idle';
      S.logRule = '';                        // 日志筛选是按规则 id 记的，跨设备没有意义
      localStorage.ssSel = p.id;
      notePos(current());
      renderChips(); renderNow(); await loadItems(); await loadScheds();
    };
    box.appendChild(b);
  }
}

/* ---------- 设备改名 ----------
 *
 * 写的是 `label`，不是 `name`：`name` 是 Mac 每次心跳都覆盖的机器名
 * （`Host.current().localizedName`），改它十几秒后就被盖回去。多一个字段，
 * Mac 永远不碰，控制端说了算。
 *
 * 也因此这件事**不用经过 Mac**：显示名只存在服务端，没有第二份要同步的副本
 * ——和成品改名正相反（那边 library.json 只有 Mac 自己能改）。好处是睡着的、
 * 关机的机器照样能改名。
 */
function openDevSheet(p) {
  S.devTarget = p.id;
  $('#dName').value = p.label || '';
  $('#dMachine').textContent = `${p.name || ''} · v${p.appVersion || '?'}`;
  // 版本落后时说清楚差在哪。升级是一次性的，所以只报要求最高的那条，
  // 后面缀上还差几项——列一长串没人读，也不改变要做的事（去点检查更新）。
  const missing = missingFeatures(p);
  const verLine = $('#dVer');
  if (missing.length) {
    const more = missing.length > 1 ? `等 ${missing.length} 项功能` : '';
    verLine.textContent = `${missing[0].name}${more}需要 ${missing[0].min}，在那台 Mac 上点菜单「检查更新」`;
    verLine.classList.remove('hide');
  } else {
    verLine.textContent = '';
    verLine.classList.add('hide');
  }
  $('#devErr').textContent = '';
  $('#scrim').classList.remove('hide'); $('#devSheet').classList.remove('hide');
  requestAnimationFrame(() => {
    $('#scrim').classList.add('show'); $('#devSheet').classList.add('show');
  });
}

function closeDevSheet() {
  S.devTarget = null;
  $('#scrim').classList.remove('show'); $('#devSheet').classList.remove('show');
  setTimeout(() => { $('#scrim').classList.add('hide'); $('#devSheet').classList.add('hide'); }, 320);
}

async function setLabel(label) {
  const id = S.devTarget;
  if (!id) return;
  try {
    const rec = await api('/api/collections/ss_players/records/' + id,
                          { method: 'PATCH', body: JSON.stringify({ label }) });
    const i = S.players.findIndex(x => x.id === id);
    if (i >= 0) S.players[i] = rec;
    closeDevSheet(); renderChips(); renderNow();
  } catch (e) { $('#devErr').textContent = String(e.message || e); }
}

$('#dSave').onclick = () => setLabel($('#dName').value.trim());
$('#dReset').onclick = () => setLabel('');
$('#dCancel').onclick = closeDevSheet;

/* ---------- 进度：本地推进，服务端纠正 ----------
 *
 * Mac 每隔几秒才推一次状态，中间控制端如果只画那个数字，进度条就是不动的
 * ——按下暂停会立刻触发一次上报，所以看起来「只有暂停时才知道播到哪」。
 *
 * 所以播放中按本地时钟往前走，每次收到新记录再对齐。判断「收到新记录」用的是
 * PocketBase 的 `updated` 而不是 position：轮询会反复拿到同一条旧记录，按 position
 * 比较会在「播放停滞」时永远重新计时，反而把停滞画成正常播放。
 */
function notePos(p) {
  if (!p) return;
  const prev = S.pos;
  if (!prev || prev.id !== p.id || prev.updated !== p.updated) {
    S.pos = { id: p.id, updated: p.updated, raw: p.position || 0, at: Date.now() };
  }
}

function shownPosition(p, d) {
  const raw = p.position || 0;
  // 只在确实在播、而且这台机器还在报心跳的时候往前走。掉线的机器继续走进度
  // 等于拿一个编出来的数字盖住「它已经不在了」。
  if (p.state !== 'playing' || !isLive(p)) return raw;
  const base = S.pos && S.pos.id === p.id ? S.pos : null;
  if (!base) return raw;
  const c = base.raw + (Date.now() - base.at) / 1000;
  return d ? Math.min(c, d) : c;
}

/* ---------- 现在 ---------- */
function renderNow() {
  const p = current();
  if (!p) {
    $('#nowName').textContent = '没有找到 Mac';
    $('#nowOut').innerHTML = '<span class="cap">在 Mac 版声拼里用同一账号登录</span>';
    setBadge('', ''); return;
  }
  const out = p.outputDevice || {};
  $('#nowName').textContent = p.currentName || '未选择';
  const canPick = canRoute(p) && selectableDevices(p).length > 1;
  $('#nowOut').innerHTML = out.name
    ? `<span class="${canPick ? 'tapdev' : ''}">${esc(out.name)}</span>`
      + `<span class="badge ${out.bluetooth ? 'bt' : ''}">${esc(out.transport || '')}</span>`
      + (out.sampleRate ? `<span class="num" style="font-size:12px">${Math.round(out.sampleRate / 1000)} kHz</span>` : '')
    : '';
  const tap = $('#nowOut .tapdev');
  if (tap) {
    tap.title = '换一个输出设备（和在 Mac 菜单栏里选是同一件事）';
    tap.onclick = openOutSheet;
  }

  const d = p.duration || 0, c = shownPosition(p, d);
  $('#prog').style.width = d ? (c / d * 100) + '%' : '0';
  $('#tCur').textContent = fmt(c);
  $('#tAll').textContent = fmt(d);
  $('#playIcon').innerHTML = p.state === 'playing'
    ? '<path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  // 手指还按在音量条上时别去写它的值——写 .value 会把滑块从手指底下拽走。
  if (!S.volHeld) {
    $('#vol').value = Math.round(readVolume(p) * 100);
  }
  renderVolKind(p, out);

  // 设备离线优先于任何指令状态：原因要指向真问题，而不是报一个假的指令失败（3g）
  if (isWaking(p)) {
    // 机器醒着、正在建指令通道。说清楚是「还不能」而不是「坏了」——
    // 这几秒里按播放曾经会收到红字「设备未回应」，而它什么毛病也没有。
    setBadge('连接中 · 稍等', 'bt', true);
  }
  else if (!isLive(p)) {
    const mins = Math.round((Date.now() - new Date(p.lastSeen || 0).getTime()) / 60000);
    setBadge(isFinite(mins) && mins < 10000 ? `离线 · 心跳 ${mins} 分前` : '离线', '');
  }
  else if (S.cmd === 'pending') setBadge('下发中', 'acc', true);
  else if (S.cmd === 'slow') setBadge('未回应', 'bt', true);
  else if (S.cmd === 'fail') setBadge(S.failMsg || '失败 · 重试', 'bad');
  else if (S.cmd === 'done') setBadge(S.doneMsg.length > 22 ? S.doneMsg.slice(0, 21) + '…' : S.doneMsg,
                                      'ok', false, S.doneMsg);
  else if (p.state === 'playing') {
    // 「播放中」本身不证明有声音：解码失败、停滞、静音、或这段本就是空白，
    // 从外面看全都一样。所以分开说，并把实测电平画出来。
    if (!reportsAudio(p)) setBadge('播放中', 'ok');       // 这台 Mac 太旧，测不了
    else setBadge(...soundVerdict(p));
  }
  else setBadge(ended(p) ? '已播完' : '已暂停', '');
}

/* 🔴 音量 0 是一个真值，不是「没上报」。
 *
 * 以前这里写的是 `p.volume || 1`，于是**静音的机器在控制端显示满格** —— 拖到 0
 * 之后松手，滑块自己弹回 100%，看起来像指令没生效（其实机器真的静音了）。
 * 那个 `|| 1` 本来是为了兜「PocketBase 的 number 字段没被写过就是 0」，靠
 * `currentItem` 猜有没有上报过；0.27.0 起音量是设备自己的音量，和装没装载成品
 * 毫无关系，`volumeKind` 一存在就说明这台机器真的报了音量，0 就是 0。 */
function readVolume(p) {
  if (p.volumeKind) return p.volume ?? 0;
  // 老版本不报 volumeKind，只能沿用旧的猜法：没装载东西时的 0 更可能是「没写过」。
  return p.currentItem ? (p.volume ?? 1) : (p.volume || 1);
}

/* 音量徽标：拖这条到底会不会改这台机器的音量。
 *
 * 用户报的就是这件事 —— 控制端拖到 50%，Mac 上的音量条纹丝不动，因为当时推的
 * 只是 AVPlayer 的软件增益。现在 Mac 优先写设备自己的音量，写不动才退回软件
 * 增益（DisplayPort 显示器那种压根没有音量控制的设备，实测确有）。两种情况
 * 手感完全一样，所以必须由徽标说清楚，不能让人拖完自己去猜。 */
function renderVolKind(p, out) {
  const el = $('#volKind');
  if (!canRoute(p)) {
    el.className = 'badge';
    el.textContent = '仅声拼';
    el.title = '这台 Mac 还是 0.27.0 以前的版本：音量只压声拼自己这一路，不动系统音量。升级后两边就是同一个数字。';
    return;
  }
  if (p.volumeKind === 'system') {
    el.className = 'badge ok';
    el.textContent = '机器音量';
    el.title = `和 Mac 菜单栏里的音量条是同一个数字：${out.name ? '「' + out.name + '」' : '这台机器'}上所有声音都跟着变。`;
  } else {
    el.className = 'badge';
    el.textContent = '仅声拼';
    el.title = `${out.name ? '「' + out.name + '」' : '这个设备'}没有硬件音量控制（DisplayPort 显示器常见），只能压声拼自己这一路，系统音量不会动。`;
  }
}

/* 输出设备：切的是系统默认输出，和在 Mac 菜单栏里选是同一件事。
 *
 * 一个事实源。只切声拼自己那一路（AVPlayer.audioOutputDeviceUniqueID）也做得到，
 * 但那样声拼在 A 上响、系统音量条指着 B，又是一次「两个数字对不上」。 */
function openOutSheet() {
  if (!current()) return;
  renderOutList();
  $('#outErr').textContent = '';
  $('#scrim').classList.remove('hide'); $('#outSheet').classList.remove('hide');
  requestAnimationFrame(() => {
    $('#scrim').classList.add('show'); $('#outSheet').classList.add('show');
  });
}

function closeOutSheet() {
  $('#scrim').classList.remove('show'); $('#outSheet').classList.remove('show');
  setTimeout(() => { $('#scrim').classList.add('hide'); $('#outSheet').classList.add('hide'); }, 320);
}

/* 🔴 切走之后的 AirPlay 行不给按。
 *
 * macOS 在你切走之后**仍然把那一行留在 CoreAudio 里**，但切回去不会连回原来
 * 那台目标（实测）——声音去了哪不知道，比没有这一行更糟。0.27.3 起 Mac 端上报
 * 时就滤掉了；这里再滤一次是为了已经装在机器上的 0.27.0–0.27.2，它们照旧报全量。 */
const selectableDevices = p =>
  (p.audioDevices || []).filter(d => d.transport !== 'AirPlay' || d.default);

function renderOutList() {
  const p = current();
  if (!p) return;
  const devices = selectableDevices(p);
  $('#oHint').textContent = '选中的设备接管这台 Mac 的全部声音';
  const box = $('#oList');
  box.innerHTML = '';
  for (const d of devices) {
    const b = document.createElement('button');
    b.className = 'pick' + (d.default ? ' on' : '');
    // 「无音量」是一条真结论，不是修饰：切过去之后音量条就只能压声拼了。
    const note = (d.transport || '') + (d.hasVolume === false ? ' · 无音量' : '');
    b.innerHTML = `<span class="ord">${d.default ? '✓' : ''}</span>
      <span class="pname">${esc(d.name)}</span>
      <span class="plen">${esc(note)}</span>`;
    b.onclick = () => {
      if (!d.default) cmd('output', { deviceUID: d.uid });
      closeOutSheet();
    };
    box.appendChild(b);
  }
}

/* 「现在有没有声音」是个错问题。
 *
 * 散布出来的一小时本来就大半是静音，按瞬时电平判，十次有九次报「无声」——
 * 于是这个警告什么也不说明了，真出问题的那次也淹在里面。用户原话：
 * 「确实可能是当前播放的静音段落，但是确实不知道到底有没有播放」。
 *
 * 改问「**出过几次声**」。计数一直在涨，就证明整条链路是通的（解码、混音、
 * 输出设备、音箱），哪怕此刻正好在间隔里。一次都没有过，才值得报警。
 */
function soundVerdict(p) {
  const n = p.soundCount || 0;
  const since = p.silentFor ?? -1;      // 距上次出声的秒数，-1 = 还没出过
  const playing = p.playingFor || 0;
  if (p.audible) return [`有声 ${meter(p.level)}`, 'ok'];
  // 老版本不报次数，退回原来的说法，别拿一个永远是 0 的计数去吓人。
  if (!reportsCount(p)) return [p.note || '无声', 'bt'];
  if (n > 0) {
    // 间隔中：这是正常状态，不是警告。次数是「它确实在响」的证据。
    const ago = since >= 0 ? ` · ${since < 60 ? Math.round(since) + ' 秒前' : Math.round(since / 60) + ' 分前'}` : '';
    return [`间隔中 · 已响 ${n} 次${ago}`, 'ok'];
  }
  // 还没出过声。刚开始播很正常——第一声之前可能就有一段静音。
  if (playing < 120) return ['等待出声', ''];
  return [`已播 ${Math.round(playing / 60)} 分还没出过声`, 'bad'];
}

function setBadge(text, kind, spinning, full) {
  const el = $('#cmdBadge');
  el.className = 'badge' + (kind ? ' ' + kind : '');
  el.title = full || '';
  el.innerHTML = (spinning
    ? '<svg class="spin" viewBox="0 0 24 24" width="10" height="10"><path fill="currentColor" d="M12 2a10 10 0 019.5 6.9l-1.9.6A8 8 0 1012 20v2A10 10 0 1112 2z"/></svg>'
    : '') + esc(text);
  el.style.display = text ? '' : 'none';
}

async function loadItems() {
  const r = await api('/api/collections/ss_items/records?perPage=200&sort=-created&filter=' +
                      encodeURIComponent(`player='${S.sel}'`));
  S.items = r.items || []; renderItems(); renderItemCount();
}

function renderItems() {
  const box = $('#items');
  if (!S.items.length) {
    box.innerHTML = '<div class="empty">这台机器还没有成品<br>在 Mac 上导出一次就会出现</div>'; return;
  }
  box.innerHTML = '';
  const manage = canManage(current());
  for (const it of S.items) {
    const el = document.createElement('div');
    el.className = 'row';
    const on = it.id === S.selItem;
    el.innerHTML = `<span class="rowmain">
        <div style="font-weight:500;color:${on ? 'var(--accent)' : 'inherit'}">${esc(it.name)}</div>
        <div class="rowsub num">${fmt(it.duration)} · ${size(it.fileSize)}</div></span>
      ${manage ? '<button class="mini more" aria-label="管理">⋯</button>' : ''}
      <button class="mini acc">播放</button>`;
    if (manage) {
      el.querySelector('.more').onclick = e => { e.stopPropagation(); openItemSheet(it); };
    }
    el.querySelector('.acc').onclick = e => { e.stopPropagation(); play(it); };
    el.onclick = () => { S.selItem = it.id; renderItems(); };
    box.appendChild(el);
  }
}

/* ---------- 共享音频（ss_shared）----------
 *
 * 账号级，不属于任何一台机器——所以它和「本机成品」是两份列表，不是一份加个标记。
 * 服务端实测：ss_items.player 是必填 relation，还带 UNIQUE(player, localPath)，
 * 它的语义就是「那台机器上的那个文件」，塞不下一条没有机器也没有路径的记录。
 *
 * 🔴 改名 / 删除直接改 PocketBase，不走 ss_commands —— 和成品正相反。
 * 成品必须走指令，是因为清单同时存在两处（Mac 的 library.json + 服务端），
 * 只改一处会被下次 syncLibrary 覆盖回去。共享条目只存在服务端这一份，
 * 没有第二份要同步，所以直接改；好处是睡着的、关机的机器都不耽误。
 *
 * 上传和下载则必须走指令：字节在 Mac 上，网页手里没有文件。
 */
async function loadShared() {
  const r = await api('/api/collections/ss_shared/records?perPage=200&sort=-created');
  S.shared = r.items || [];
  if (S.itemTab === 'shared') renderShared();
  renderItemCount();
}

const sharedURL = it => `${S.url}/api/files/ss_shared/${it.id}/${it.file}`;

/* 🔴 试听在**这台设备**上出声（手机就是手机的喇叭），完全不惊动任何一台 Mac。
 * 这跟「播放」是两件事，别混：
 *   试听 = 这个浏览器放，用来确认「这条是哪个」
 *   下到本机之后点播放 = 遥控那台 Mac 放，声音从它接的音箱出来
 * 所以播放中把那一行的副标题换成「在这台设备上播放 · 进度」——
 * 用户问过「试听是不是远程播放」，屏幕上没有一处回答过这个问题就是设计漏了。
 *
 * PB 的 file 字段没设 protected，所以直接就能播，不用换 file token；
 * 文件名带随机后缀，URL 猜不出来。 */
function audition(it) {
  if (S.auditioning === it.id) { stopAudition(); renderShared(); return; }
  stopAudition();
  S.auditionErr = '';
  S.audio = new Audio(sharedURL(it));
  S.audio.onended = () => { S.auditioning = null; renderShared(); };
  // 🔴 失败必须出声。原来这里静默复位，按钮自己弹回「试听」而一句话没有 ——
  // 从外面看和「点了没反应」一模一样。
  S.audio.onerror = () => { auditionFailed('这台设备放不出这个文件'); };
  // 进度直接改那一个元素，不重绘整张列表：正在按的按钮被重绘就会丢掉点击。
  S.audio.ontimeupdate = () => {
    const el = document.querySelector(`[data-sub="${it.id}"]`);
    if (el) el.textContent = `在这台设备上播放 · ${fmt(S.audio.currentTime)} / ${fmt(it.duration)}`;
  };
  S.audio.play().then(() => { S.auditioning = it.id; renderShared(); })
    // 区分两种失败：文件根本没加载出来（audio.error 有值）和自动播放被拦。
    // 报错报错了方向，用户就会去修一个不存在的问题。
    .catch(() => auditionFailed(S.audio && S.audio.error
                                ? '这台设备放不出这个文件'
                                : '浏览器拦下了播放，再点一次'));
}

function auditionFailed(why) {
  S.audio = null;
  S.auditioning = null;
  S.auditionErr = why;
  renderShared();
  clearTimeout(S.auditionTimer);
  S.auditionTimer = setTimeout(() => { S.auditionErr = ''; renderShared(); }, 5000);
}

function stopAudition() {
  if (S.audio) { S.audio.pause(); S.audio = null; }
  S.auditioning = null;
}

function renderItemCount() {
  const n = S.itemTab === 'local' ? S.items.length : S.shared.length;
  $('#itemCount').textContent = n ? `${n} 条` : '';
}

function renderShared() {
  const box = $('#shared');
  if (!S.shared.length) {
    box.innerHTML = '<div class="empty">共享库是空的<br>' +
      '在「本机」里点 ⋯ →「上传到共享」，别的机器就能拉下来</div>';
    renderItemCount(); return;
  }
  box.innerHTML = '';
  const p = current();
  const pullable = canShare(p);
  for (const it of S.shared) {
    const el = document.createElement('div');
    el.className = 'row';
    const playing = S.auditioning === it.id;
    const sub = playing ? '在这台设备上播放'
              : (S.auditionErr && S.auditionErrID === it.id) ? S.auditionErr
              : `${fmt(it.duration)} · ${size(it.fileSize)}`;
    el.innerHTML = `<span class="rowmain">
        <div style="font-weight:500">${esc(it.name)}</div>
        <div class="rowsub num" data-sub="${it.id}"${
          (S.auditionErr && S.auditionErrID === it.id) ? ' style="color:var(--bad)"' : ''
        }>${esc(sub)}</div></span>
      <button class="mini more" aria-label="管理">⋯</button>
      <button class="mini play">${playing ? '停' : '试听'}</button>
      <button class="mini acc" ${pullable ? '' : 'disabled'}>${pullable ? '下到这台' : '设备需更新'}</button>`;
    el.querySelector('.more').onclick = e => { e.stopPropagation(); openSharedSheet(it); };
    const listen = el.querySelector('.play');
    listen.title = '在你现在用的这台设备上放（手机就是手机的喇叭），不遥控任何 Mac';
    listen.onclick = e => { e.stopPropagation(); S.auditionErrID = it.id; audition(it); };
    const pull = el.querySelector('.acc');
    // 🔴 一个点不动又不说为什么的按钮，比没有这个按钮更糟。手机上没有 hover，
    // 所以原因必须写在按钮**脸上**，tip 只补细节。
    pull.title = pullable ? '下载到当前选中的这台 Mac，之后就是一个普通本地素材'
                          : `${deviceName(p)} 还是旧版（${p && p.appVersion || '?'}），` +
                            '在那台 Mac 上点菜单「检查更新」升到 0.29.0 以上就能用';
    pull.onclick = e => { e.stopPropagation(); if (pullable) cmd('pull', { itemId: it.id }); };
    box.appendChild(el);
  }
  renderItemCount();
}

function switchItemTab(t) {
  S.itemTab = t;
  for (const b of $('#itemSeg').querySelectorAll('button')) b.classList.toggle('on', b.dataset.t === t);
  $('#items').classList.toggle('hide', t !== 'local');
  $('#shared').classList.toggle('hide', t !== 'shared');
  if (t === 'shared') { renderShared(); loadShared().catch(() => {}); }
  else { stopAudition(); renderItems(); }
  renderItemCount();
}
$('#itemSeg').onclick = e => { const b = e.target.closest('button'); if (b) switchItemTab(b.dataset.t); };

/* ---------- 成品管理：改名 / 移除 ----------
 *
 * 两个动作都走 ss_commands 而不是直接改 PocketBase：清单同时存在两处，
 * 而 Mac 那份 library.json 只有 Mac 自己能改。只在服务端删掉的行，会在下次
 * 重连 syncLibrary 时原样长回来——一个会自己撤销的删除比没有删除更糟。
 * 代价是管理和播放一样需要设备在线，这跟条目本身指向那台机器上的文件是一致的。
 */
function openItemSheet(it) {
  S.manageItem = it;
  $('#iName').value = it.name;
  $('#iPath').textContent = it.localPath || '';
  $('#itemErr').textContent = '';
  const p = current();
  $('#iShare').disabled = !canShare(p);
  $('#iShare').textContent = canShare(p) ? '上传到共享' : '上传到共享（设备需更新）';
  disarmDelete();
  $('#scrim').classList.remove('hide'); $('#itemSheet').classList.remove('hide');
  requestAnimationFrame(() => {
    $('#scrim').classList.add('show'); $('#itemSheet').classList.add('show');
  });
}

function closeItemSheet() {
  $('#scrim').classList.remove('show'); $('#itemSheet').classList.remove('show');
  setTimeout(() => { $('#scrim').classList.add('hide'); $('#itemSheet').classList.add('hide'); }, 320);
}

function disarmDelete() {
  const b = $('#iDel');
  b.classList.remove('armed');
  b.textContent = '从控制端移除';
  clearTimeout(S.armTimer);
}

/* 从链接抓音频：网页只发一条指令，下载由被控端自己做。
 * 🔴 音频必须落在**要播它的那台机器**的盘上（定时和点播都读本地文件），
 * 浏览器下完再传上去等于同样的字节搬两趟。 */
function openFetchSheet() {
  const p = current();
  $('#fLink').value = '';
  $('#fetchErr').textContent = '';
  $('#fTarget').textContent = p ? `下载到 ${deviceName(p)}` : '先选一台设备';
  const ok = canFetch(p);
  $('#fGo').disabled = !ok;
  $('#fGo').textContent = ok ? '下载' : '下载（设备需更新）';
  $('#scrim').classList.remove('hide'); $('#fetchSheet').classList.remove('hide');
  requestAnimationFrame(() => {
    $('#scrim').classList.add('show'); $('#fetchSheet').classList.add('show');
  });
  setTimeout(() => $('#fLink').focus(), 340);
}
function closeFetchSheet() {
  $('#scrim').classList.remove('show'); $('#fetchSheet').classList.remove('show');
  setTimeout(() => { $('#scrim').classList.add('hide'); $('#fetchSheet').classList.add('hide'); }, 320);
}
$('#bFetch').onclick = openFetchSheet;
$('#fCancel').onclick = closeFetchSheet;
$('#fGo').onclick = () => {
  const p = current(), link = $('#fLink').value.trim();
  if (!canFetch(p)) {
    $('#fetchErr').textContent =

/* ---------- 异步指令三态（3g） ---------- */
/* 🔴 8 秒判死是按「点播放」定的。搬字节的指令不是那个量级：
 * 抓链接要下完整段视频再分离音轨，共享要传/收整个文件。
 * 用同一个期限的结果是机器干得好好的，控制端已经红字说它没回应。 */
const CMD_LIMIT = { fetch: 180000, share: 120000, pull: 120000,
                   /* 🔴 极短音效的回执是**故意**延后的：0.31.1 起 Mac 端会等 10 秒
                    * 以内的素材播完再回执，好把「响了 N 次」写进结论里 —— 否则
                    * 回执写在 play() 之后 0 ms，那时没有任何证据，而心跳要十几秒
                    * 后才补上。最长 10+2 秒，留三秒余量给往返。 */
                   play: 15000, load: 15000 };

async function cmd(action, payload = {}) {
  if (!current()) return;
  clearTimeout(S.cmdTimer); clearTimeout(S.failTimer);
  S.cmd = 'idle';
  // 转圈只在 90 ms 后出现：多数指令 200 ms 内回报，立刻转圈反而更像卡顿。
  S.cmdTimer = setTimeout(() => { S.cmd = 'pending'; renderNow(); }, 90);
  try {
    const rec = await api('/api/collections/ss_commands/records', { method: 'POST',
      body: JSON.stringify({ player: S.sel, action, payload, status: 'pending' }) });
    watch(rec.id, CMD_LIMIT[action] || 8000);
  } catch (e) { fail(String(e.message || e)); }
}

/* 🔴 回执走 SSE，轮询退成兜底。
 *
 * 通道本来就在：控制端早就订了 ss_players / ss_items / ss_schedules / ss_runs /
 * ss_shared，独独漏了 ss_commands —— 于是「这条指令办完了没有」是页面上唯一
 * 还靠问出来的东西。0.31.1 把短音效的回执改成**等播完再写**之后，代价现身了：
 * play 的期限是 15 秒，落进「长任务」那一档，5 秒后退到 2 秒一问，声音早停了
 * 绿徽标还没出来。
 *
 * 🔴 **兜底不能删。** 两件事事件永远送不到：SSE 在 iOS 上会「看起来还连着」却
 * 不送数据（和 45 秒慢轮询同一个理由），以及**一台不回应的机器什么都不会发** ——
 * 「设备未回应」「连接中」只能靠自己数时间。所以轮询保留，只是节奏从 400 ms
 * 放到 1.2 / 2.5 秒：它现在是保险，不是主路。 */
function watch(id, limit = 8000) {
  // 同一时刻只跟一条：新指令直接顶掉旧的，否则先超时的那条会把后一条的转圈
  // 也刷成红字。tick 每次醒来都核对自己还是不是当前那条。
  clearTimeout(S.watchTimer);
  S.watch = { id, limit, began: Date.now() };
  const tick = async () => {
    if (!S.watch || S.watch.id !== id) return;
    const age = Date.now() - S.watch.began;
    let rec;
    try { rec = await api('/api/collections/ss_commands/records/' + id); }
    // 网络抖一下不该让整条 watch 就此停住（转圈会一直挂在那儿）。接着数时间，
    // 该判死的时候由下面那几条判。
    catch { rec = null; }
    if (rec && settleCommand(rec)) return;
    const p = current();
    // 🔴 连接中要接着等，别按 8 秒判死。Mac 端 0.26.5 起会在订阅成功后补读
    // 订阅前积压的指令（宽限 90 秒），所以这条命令多半马上就会被执行 ——
    // 以前这里报「设备未回应」，而机器好好的，只是通道还没建起来。
    if (isWaking(p)) {
      if (age < 95000) { clearTimeout(S.cmdTimer); S.cmd = 'idle'; renderNow();
                         S.watchTimer = setTimeout(tick, 1000); return; }
      return giveUp(id, '设备一直没连上');
    }
    // 心跳同时失鲜就不报指令失败——原因要指向真问题。
    if (!isLive(p)) { clearTimeout(S.cmdTimer); S.cmd = 'idle'; renderNow(); S.watch = null; return; }
    if (age > limit) return giveUp(id, '设备未回应');
    // 「未回应」要跟着这条指令**该花多久**走。固定 3 秒的话，正在下载的 fetch、
    // 正在等短音效播完的 play，都会在机器干得好好的时候被刷成橙字。
    // 8 秒那档算出来还是 3 秒不到，所以普通指令的行为一点没变。
    if (age > Math.max(3000, limit / 3)) { clearTimeout(S.cmdTimer); S.cmd = 'slow'; renderNow(); }
    S.watchTimer = setTimeout(tick, age < 5000 ? 1200 : 2500);
  };
  S.watchTimer = setTimeout(tick, 600);
}

/* 指令到终态了就收尾。SSE 和兜底轮询都走这里——两条路一份逻辑，否则迟早分家，
 * 而分家的那份恰好是不常走的那份。返回真 = 这条已经了结，别再跟了。 */
function settleCommand(rec) {
  if (!S.watch || !rec || rec.id !== S.watch.id) return false;
  if (rec.status === 'done') {
    S.watch = null; clearTimeout(S.watchTimer); clearTimeout(S.cmdTimer);
    // 🔴 以前 done 只是把转圈收掉，屏幕上什么也不说 —— 下载完了、或者
    // 「本机已有同一份」这种最该看见的结论，全都只留在 ss_commands.result 里，
    // 而那是没人会去翻的地方。成功和失败一样需要一句话。
    S.doneMsg = rec.result || '';
    S.cmd = S.doneMsg ? 'done' : 'idle';
    renderNow();
    clearTimeout(S.doneTimer);
    if (S.doneMsg) S.doneTimer = setTimeout(() => {
      if (S.cmd === 'done') { S.cmd = 'idle'; S.doneMsg = ''; renderNow(); }
    }, 6000);
    return true;
  }
  if (rec.status === 'failed') { giveUp(rec.id, rec.result || '执行失败'); return true; }
  return false;
}

/* 判死：停掉这条 watch 再报，免得已经红了的指令被下一拍轮询又摸一次。 */
function giveUp(id, msg) {
  if (S.watch && S.watch.id !== id) return;
  S.watch = null; clearTimeout(S.watchTimer);
  fail(msg);
}

function fail(msg) {
  clearTimeout(S.cmdTimer);
  S.cmd = 'fail'; S.failMsg = msg; renderNow();
  const keys = $('#keys');
  keys.classList.remove('shake'); void keys.offsetWidth; keys.classList.add('shake');
  // 失败要看得见，但不该赖着不走。
  S.failTimer = setTimeout(() => { S.cmd = 'idle'; renderNow(); }, 3000);
}

const play = it => { S.selItem = it.id; renderItems();
  cmd('play', { localPath: it.localPath, name: it.name, itemId: it.id }); };
$('#bPlay').onclick = () => {

    // `play()` 毫无反应（实测 rate 仍是 0、位置不动），回执却照样是 done ——
    // 症状就是「点了播放，进度条一直是播完的样子」。0.22.0 起 Mac 端会自己
    // 先回到开头；老版本靠带上路径重新装载，同样从头播。
    const again = ended(p) && !rewindsAtEnd(p)

};
